name: G3-B B20 trusted public/private boundary (no-deploy)
on:
  push:
    branches: [test/data-b-g3b-b20-trusted-gas-e2e-20261117]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g3b-secure-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax of restricted GAS files and test harness
        shell: bash
        run: |
          set -eu
          for f in DocDuLieuSheet.gs DuLieuToanSheet.gs MayChu.gs ThanhTichMayChu.gs PhuHuynhMayChu.gs G3ATrustedTest.gs; do node --check --input-type=commonjs < "$f"; done
          node --check qa/g3b/test_g3b_boundary.cjs
      - name: Reuse G3-A private grading VM and JSON HTTP loopback
        run: |
          node qa/g3a/test_g3a_isolated.cjs
          node qa/g3a/test_g3a_http_loopback.cjs
      - name: "Regression: legacy secret-export bypasses denied, QA has no writes"
        run: node qa/g3b/test_g3b_boundary.cjs
      - name: "Browser QA bridge: 21 simulated public RPC checks (not actual GAS)"
        run: node qa/g3b/test_g3b_browser_smoke.cjs
      - name: "P0 integrated 25-case semantic, unit and renderer QA (no GAS deploy)"
        run: |
          node --check --input-type=commonjs < 89_P0_VariantRouter.html
          node --check --input-type=commonjs < 90_P0_VectorStructural.html
          node --check --input-type=commonjs < G2B_ReviewFixtures.html
          node qa/p0-g2b-adaptation/test_p0_contract.cjs
      - name: Preserve scope-labeled evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3b-test-only-code-qa
          path: |
            qa/g3a/G3A_TEST_RESULTS.json
            qa/g3a/G3A_HTTP_LOOPBACK_RESULTS.json
            qa/g3b/G3B_RESULTS.json
            qa/g3b/G3B_BROWSER_SMOKE_RESULTS.json
            qa/p0-g2b-adaptation/TEST_RESULTS.json
            qa/p0-g2b-adaptation/QC25_CASE_MATRIX_RESULTS.json
          retention-days: 14

  g2b-review-browser:
    needs: g3b-secure-test
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium for synthetic QA review only
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render 25 P0 cases on desktop and mobile, no actual GAS
        run: node qa/p0-g2b-adaptation/test_integrated_browser.cjs
      - name: Retain read-only visual evidence (not SGK images)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-g2b-visual-review-fixtures-only
          path: |
            qa/p0-g2b-adaptation/QC25_BROWSER_RESULTS.json
            qa/p0-g2b-adaptation/screenshots/
          retention-days: 14
