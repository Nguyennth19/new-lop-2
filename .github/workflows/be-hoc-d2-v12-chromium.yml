name: BE-HOC D2 V1.2 Chromium desktop/mobile
on:
  push:
    branches: [be-hoc]
    paths:
      - 'GiaoDien.html'
      - '19_KhongGianHocToan.html'
      - '47_D2V12_Core.html'
      - '48_D2V12_View.html'
      - '49_D2V12_BaiHoc.html'
      - '52_D2_ManualCarry.html'
      - '50_CSS_D2V12.html'
      - 'qa/be-hoc-d2-v12/**'
      - '.github/workflows/be-hoc-d2-v12-chromium.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d2-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node qa/be-hoc-d2-manual/manual-browser.test.cjs
