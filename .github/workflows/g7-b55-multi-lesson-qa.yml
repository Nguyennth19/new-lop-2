name: G7.4-B.5.5 Multi Lesson Visual Intent QA
on:
  push:
    branches:
      - test/g7-4-b5-5-multi-lesson-visual-intent-qa-20261113
    paths:
      - 'BoKiemDuyetVisualIntentNhieuBai.gs'
      - 'du-lieu/bien-the/chuan/tieng-anh-demo.visual-intent.v1.json'
      - 'du-lieu/bien-the/chuan/visual-intent-multi-lesson-gate.v1.json'
      - 'qa/g7-4-b5-5/**'
      - '.github/workflows/g7-b55-multi-lesson-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multi-lesson-release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Two lesson opt-in and blocked cases with fixture hash verification
        run: node qa/g7-4-b5-5/test-multi-lesson-gate.cjs
      - name: B5.4 prior single-lesson regression
        run: node qa/g7-4-b5-4/test-generator-gate.cjs
      - name: B5.3 normalized variants and shared selector regression
        run: |
          node qa/g7-4-b5-3/test-variant-visual-intent.cjs
          node qa/g7-4-b5-1/test-shared-selector.cjs
      - name: B20 30 questions six sessions grading and renderer
        run: node thu-nghiem/bai-20-bien-the/kiem-tra-hoi-quy.js
      - name: CSS baseline and image fallback
        run: |
          node qa/g7-4-b3-1/test-controlled-merge.cjs
          node qa/g7-4-b3-1/test-visual-fallback.cjs
          node qa/hotfix-b20-book/test-book-illustration.cjs
      - name: Apps Script syntax
        run: |
          cp BoKiemDuyetVisualIntentNhieuBai.gs /tmp/g7-b55.cjs
          node --check /tmp/g7-b55.cjs
