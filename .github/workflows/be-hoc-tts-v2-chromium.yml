name: BE-HOC V2 Chromium desktop/mobile no-deploy
on:
  push:
    branches: [be-hoc]
    paths:
      - 'GiaoDien.html'
      - '19_KhongGianHocToan.html'
      - '41_HienThiCauHoiToan.html'
      - '44_G75_NormalizerToanV2.html'
      - '45_DieuKhienGiongDocToan.html'
      - '46_CSS_GiongDocToan.html'
      - 'qa/be-hoc-tts-v2/**'
      - '.github/workflows/be-hoc-tts-v2-chromium.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-voice-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright browser test environment
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Chrome desktop and mobile emulation regression
        run: node qa/be-hoc-tts-v2/tts-browser.test.cjs
