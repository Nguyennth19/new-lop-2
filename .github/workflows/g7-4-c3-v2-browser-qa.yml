name: G7.4 C3 Visual Demo V2 Browser QA
on:
  push:
    branches: ['test/g7-4-c3-visual-demo-v2-20261113']
    paths:
      - 'qa/g7-4-c1-c5/G7_C3_Ten_Form_Visual_Review_V2.html'
      - '.github/workflows/g7-4-c3-v2-browser-qa.yml'
  workflow_dispatch:
jobs:
  visual:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse standalone JavaScript and verify required UI
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),vm=require('node:vm');
          const html=fs.readFileSync('qa/g7-4-c1-c5/G7_C3_Ten_Form_Visual_Review_V2.html','utf8');
          const script=html.match(/<script>([\s\S]*?)<\/script>/);
          assert.ok(script,'missing inline JS');new vm.Script(script[1]);
          assert.equal((html.match(/data:image\/svg\+xml/g)||[]).length,11);
          assert.ok(html.includes('qaAuto'));
          assert.ok(html.includes('47 chiếc kẹo')&&html.includes('34 chiếc kẹo'));
          assert.ok(html.includes('WORD_PROBLEM_3STEP')&&html.includes('PICTOGRAPH'));
          console.log('PASS offline HTML syntax and 11 original Fluent Flat icons');
          JS
      - name: Headless Chrome all ten interactive activities
        run: |
          set -eu
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          FILE="file://$PWD/qa/g7-4-c1-c5/G7_C3_Ten_Form_Visual_Review_V2.html?qaAuto=1"
          timeout 80s "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4500 --window-size=390,960 --dump-dom "$FILE" > /tmp/g74c3v2.html 2> /tmp/g74c3v2.log
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/g74c3v2.html').read_text()
          for text in ['data-qa-task-count="10"','data-qa-passed="10"','data-qa-errors="0"','data-qa-finished="10"','data-qa-horizontal-overflow="false"']:
              assert text in s, f'Browser did not verify {text}'
          print('PASS Chrome: 10 interactive tasks answered, no horizontal overflow')
          PY
      - name: Validate user content isolation
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const src=fs.readFileSync('qa/g7-4-c1-c5/G7_C3_Ten_Form_Visual_Review_V2.html','utf8');
          assert.ok(!src.includes('google.script.run'));
          assert.ok(!src.includes('localStorage'));
          assert.ok(!src.includes('fetch('));
          assert.ok(!src.includes('PENDING_OWNER_PASS'));
          console.log('PASS: offline only, no student data writes, source app untouched');
          JS
