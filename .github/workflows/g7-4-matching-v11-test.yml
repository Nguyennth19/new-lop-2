name: G7.4 Matching Reference V1.1 TEST
on:
  push:
    branches:
      - test/g7-4-matching-reference-v11-20261114
    paths:
      - 'qa/g7-4-matching-reference-v11/**'
      - '.github/workflows/g7-4-matching-v11-test.yml'
  workflow_dispatch:
jobs:
  matching-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contract, state, security and frozen-source regression
        run: node qa/g7-4-matching-reference-v11/matching-v11.test.cjs
