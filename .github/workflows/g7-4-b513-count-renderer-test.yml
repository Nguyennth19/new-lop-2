name: G7.4 B5.13 Count Renderer Integration TEST
on:
  push:
    branches: ['test/g7-4-b5-13-count-renderer-b6-20261113']
    paths:
      - 'qa/g7-4-b5-13/**'
      - 'qa/g7-4-b5-13-count-renderer-contract.v1.json'
      - 'qa/g7-4-b6-demand-ledger.v1.json'
      - 'hinh-anh/svg-fallback/fluent-emoji-flat/v1/qa/G7_B513_Count_Renderer_TEST.html'
      - '.github/workflows/g7-4-b513-count-renderer-test.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax and contract
        run: |
          node --check qa/g7-4-b5-13/count-renderer-core.cjs
          node --check qa/g7-4-b5-13/count-renderer-core.test.cjs
          node qa/g7-4-b5-13/count-renderer-core.test.cjs
          node qa/g7-4-b5-13/offline-html-and-b6.test.cjs
      - name: Headless Chrome real browser count scenes
        run: |
          set -eu
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          FILE="file://$PWD/hinh-anh/svg-fallback/fluent-emoji-flat/v1/qa/G7_B513_Count_Renderer_TEST.html"
          run_case() {
            case_name="$1"; params="$2"; expected="$3"; expected_icons="$4"
            timeout 60s "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=2500 --window-size=390,900 --dump-dom "$FILE?$params" > "/tmp/g74_$case_name.html" 2> "/tmp/g74_$case_name.log"
            python3 - "$case_name" "$expected" "$expected_icons" <<'PY'
          import sys,re,pathlib
          name,expected,num=sys.argv[1:]
          html=pathlib.Path('/tmp/g74_'+name+'.html').read_text()
          assert 'id="stage"' in html, name+' stage missing'
          assert f'data-qa-total="{expected}"' in html if expected!='BLOCKED' else ('class="error"' in html and 'BLOCKED' in html), name+' incorrect count or block'
          actual=len(re.findall(r'class="obj"',html))
          assert actual==int(num),(name,actual,num)
          if expected!='BLOCKED':
            assert 'data-qa-horizontal-overflow="false"' in html,name+' horizontal overflow detected'
            assert f'data-qa-actual-icons="{num}"' in html,name+' actual icon count mismatch'
          print('PASS browser',name,'images=',actual)
          PY
          }
          run_case apple50 'asset=red_apple&qty=50&unit=qu%E1%BA%A3&width=320' 50 50
          run_case grapes3 'asset=grapes&qty=3&unit=ch%C3%B9m&width=390' 3 3
          run_case grapes_bad 'asset=grapes&qty=3&unit=qu%E1%BA%A3&width=390' BLOCKED 0
          run_case books_bad 'asset=books&qty=3&unit=b%E1%BB%99&width=320' BLOCKED 0
          run_case add12 'asset=rabbit&type=add&qty=7&group=5&unit=con&width=390' 12 12
          run_case banana3 'asset=banana&qty=3&unit=qu%E1%BA%A3&width=320' 3 3
          run_case watermelon3 'asset=watermelon&qty=3&unit=mi%E1%BA%BFng&width=320' 3 3
          run_case cherries3 'asset=cherries&qty=3&unit=ch%C3%B9m&width=390' 3 3
          run_case subtract5 'asset=red_apple&type=subtract&qty=9&group=4&unit=qu%E1%BA%A3&width=390' 5 13
      - name: Check offline gallery and source invariants
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const r=JSON.parse(fs.readFileSync('qa/g7-4-b5-13-count-renderer-contract.v1.json','utf8'));
          const m=JSON.parse(fs.readFileSync('hinh-anh/svg-fallback/fluent-emoji-flat/v1/manifest.v1.json','utf8'));
          const html=fs.readFileSync('hinh-anh/svg-fallback/fluent-emoji-flat/v1/qa/G7_B513_Count_Renderer_TEST.html','utf8');
          assert.equal((html.match(/data:image\/svg\+xml/g)||[]).length,46);
          assert.equal(r.approvedCount,45);
          assert.equal(r.illustrationOnlyCount,1);
          assert.equal(r.assets.length,46);
          assert.equal(m.icons.length,46);
          assert.equal(m.enabled,false);
          assert.equal(m.productionActivation,false);
          assert.equal(m.renderPolicy.allowCountInference,false);
          assert.equal(r.runtimeEnabled,false);
          assert.equal(r.productionActivation,false);
          for(const x of r.assets)assert.equal(m.icons.find(i=>i.id===x.assetId)?.sha256,x.sourceSha256);
          console.log('PASS 46 SVG embedded, 45 exact unit count permissions TEST, production OFF');
          JS
