name: B20 Book Image Hotfix QA
on:
  push:
    branches:
      - hotfix/b20-book-illustration-20261112
    paths:
      - '34_HinhAnhDungChung.html'
      - 'qa/hotfix-b20-book/**'
      - '.github/workflows/b20-book-hotfix-qa.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node qa/hotfix-b20-book/test-book-illustration.cjs
