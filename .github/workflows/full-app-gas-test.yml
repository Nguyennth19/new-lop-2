name: Full App modular GAS TEST (no deploy)
on:
  push:
    branches: [integration/full-app-gas-test]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node qa/full-app-gas-test/contract.test.cjs
