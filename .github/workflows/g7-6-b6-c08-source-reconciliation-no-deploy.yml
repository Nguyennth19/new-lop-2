name: G7.6 B6 C08 SGK/P0.6 Source Reconciliation (NO DEPLOY)
on:
  push:
    branches:
      - test/g7-6-b6-c08-source-reconciliation-20261116
    paths:
      - 'qa/g7-6-b6-c08/**'
      - 'docs/kiem-dinh/G7.6-B6-C08_*'
      - '.github/workflows/g7-6-b6-c08-source-reconciliation-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout immutable P0.6 registry
        uses: actions/checkout@v4
        with:
          repository: Nguyennth19/new-lop-2
          ref: c0c5620f30edd92ab45d4ec87a8a07ffa38948e2
          path: _external/p06
          persist-credentials: false
      - name: Confirm frozen B6 parent and restrict diff
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0a453101ab47567bdf3ff820f9b58a9d7c0c86d3 HEAD
          test "$(git -C _external/p06 rev-parse HEAD)" = c0c5620f30edd92ab45d4ec87a8a07ffa38948e2
          if git diff --name-only 0a453101ab47567bdf3ff820f9b58a9d7c0c86d3 HEAD | grep -Ev '^(qa/g7-6-b6-c08/|docs/kiem-dinh/G7\.6-B6-C08_|\.github/workflows/g7-6-b6-c08-source-reconciliation-no-deploy.yml)' ; then
            echo PROTECTED_DIFF_DENIED; exit 1
          fi
          for f in du-lieu/g7-6/resource-renderer-manifest.v1.json qa/g7-6-b6/mental-renderer-registration.candidate.v1.json qa/g7-6-b6/approvals/C07.approval.pending.v1.json; do
            test "$(git hash-object "$f")" = "$(git show 0a453101ab47567bdf3ff820f9b58a9d7c0c86d3:"$f" | git hash-object --stdin)"
          done
          echo C08_PROTECTED_SCOPE_PASS
      - name: Validate B027/B065 source correction candidates and exact P0.6 catalog only
        run: |
          node --check qa/g7-6-b6-c08/c08-reconciliation.test.cjs
          node qa/g7-6-b6-c08/c08-reconciliation.test.cjs _external/p06
      - name: Archive public metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G76-B6-C08-SOURCE-RECONCILIATION-UNSIGNED-NO-DEPLOY
          path: |
            qa/g7-6-b6-c08/*.json
            docs/kiem-dinh/G7.6-B6-C08_SOURCE_RECONCILIATION_20261116.md
          retention-days: 30
