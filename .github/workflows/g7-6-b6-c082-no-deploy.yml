name: G7.6 B6 C08.2 source-item E04 skill review (NO DEPLOY)
on:
  push:
    branches:
      - test/g7-6-b6-c082-source-item-skill-review-20261116
    paths:
      - 'qa/g7-6-b6-c082/**'
      - 'docs/kiem-dinh/G7.6-B6-C082_*'
      - '.github/workflows/g7-6-b6-c082-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout pinned P0.6 catalog for independent source verification
        uses: actions/checkout@v4
        with:
          repository: Nguyennth19/new-lop-2
          ref: c0c5620f30edd92ab45d4ec87a8a07ffa38948e2
          path: _external/p06
          persist-credentials: false
      - name: Guard protected state and exact base
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ef73696db6380997fea6a2d1465e691b9a303739 HEAD
          if git diff --name-only ef73696db6380997fea6a2d1465e691b9a303739 HEAD | grep -Ev '^(qa/g7-6-b6-c082/|docs/kiem-dinh/G7\.6-B6-C082_|\.github/workflows/g7-6-b6-c082-no-deploy.yml)' ; then echo UNEXPECTED_PROTECTED_CHANGE;exit 1; fi
          for p in qa/g7-6-b6-c081/working-source-overlay.v1.json qa/g7-6-b6-c081/vbt-lv2-evidence.v1.json qa/g7-6-b6/approvals/C07.approval.pending.v1.json qa/g7-6-b6/mental-renderer-registration.candidate.v1.json du-lieu/g7-6/resource-renderer-manifest.v1.json; do
            test "$(git hash-object "$p")" = "$(git show ef73696db6380997fea6a2d1465e691b9a303739:"$p" | git hash-object --stdin)"
          done
          test "$(git -C _external/p06 rev-parse HEAD)" = c0c5620f30edd92ab45d4ec87a8a07ffa38948e2
          test -f _external/p06/thu-nghiem/p0-6/fb/fb2-lesson-catalog.candidate.json
      - name: Review 13 old items, 13 SGK source activities, 13 LV2 VBT items, E04 owner gates
        run: |
          node --check qa/g7-6-b6-c082/c082-review.test.cjs
          node qa/g7-6-b6-c082/c082-review.test.cjs
      - name: Save public metadata proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G76-B6-C082-SOURCE-E04-OWNER-UNSIGNED-NO-DEPLOY
          path: |
            qa/g7-6-b6-c082/*.json
            qa/g7-6-b6-c082/approvals/*.json
            docs/kiem-dinh/G7.6-B6-C082_SOURCE_ITEM_E04_20261116.md
          retention-days: 30
