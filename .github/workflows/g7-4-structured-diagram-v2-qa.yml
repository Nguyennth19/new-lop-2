name: G7.4 Structured Diagram Rules V2 QA
on:
  push:
    branches: ['test/g7-4-structured-diagram-rules-v2-20261113']
    paths:
      - 'qa/g7-4-structured-diagrams-v2/**'
      - '.github/workflows/g7-4-structured-diagram-v2-qa.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit, anti-answer-leak and pedagogical variant gates
        run: |
          node --check qa/g7-4-structured-diagrams-v2/structured-diagram-core.cjs
          node --check qa/g7-4-structured-diagrams-v2/structured-diagram-core.test.cjs
          node qa/g7-4-structured-diagrams-v2/structured-diagram-core.test.cjs
      - name: Verify HTML contains only public plans
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),vm=require('node:vm');
          const h=fs.readFileSync('qa/g7-4-structured-diagrams-v2/G7_Structured_Diagram_V2_Visual_QA.html','utf8');
          const m=h.match(/<script>([\s\S]*?)<\/script>/);
          assert.ok(m);new vm.Script(m[1]);
          assert.ok(h.includes('BOND_8_5_LV1'));
          assert.equal(h.includes('serverOnly:true'),false);
          assert.equal(h.includes('function answerKey'),false);
          assert.equal(h.includes('google.script.run'),false);
          assert.equal(h.includes('localStorage'),false);
          assert.equal(h.includes('fetch('),false);
          const obj=JSON.parse(m[1].match(/const plans=(\[[\s\S]*?\]);\nconst \$=/)[1]);
          assert.equal(obj.length,5);
          for(const p of obj){for(const k of p.hidden)assert.equal(p.fields[k],null);}
          console.log('PASS HTML: 5 public examples, 0 embedded hidden answers');
          JS
      - name: Headless Chrome mobile/desktop responsive smoke QA
        run: |
          set -eu
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          FILE="file://$PWD/qa/g7-4-structured-diagrams-v2/G7_Structured_Diagram_V2_Visual_QA.html"
          for width in 320 360 390 768 1024; do
            for scene in 1 2 3 4 5; do
              timeout 60s "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=1800 --window-size="$width,900" --dump-dom "$FILE?scene=$scene" > "/tmp/g74d_${width}_${scene}.html" 2> /dev/null
            done
          done
          python3 - <<'PY'
          from pathlib import Path
          for width in [320,360,390,768,1024]:
              for scene in range(1,6):
                  s=Path(f'/tmp/g74d_{width}_{scene}.html').read_text()
                  assert 'data-qa-scene-count="5"' in s,(width,scene,'missing scene list')
                  assert 'data-qa-inputs="' in s,(width,scene,'no fields')
                  assert 'data-qa-horizontal-overflow="false"' in s,(width,scene,'overflow')
          print('PASS 25 Chrome width x lesson scenes, no document overflow')
          PY
      - name: Preserve TEST only and unchanged global policy
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const policy=JSON.parse(fs.readFileSync('qa/g7-4-structured-diagrams-v2/policy.v2.json','utf8'));
          const old=JSON.parse(fs.readFileSync('qa/g7-4-c1-c5/ten-form-policy.v1.json','utf8'));
          const m=JSON.parse(fs.readFileSync('hinh-anh/svg-fallback/fluent-emoji-flat/v1/manifest.v1.json','utf8'));
          assert.equal(old.exerciseTypes.length,10);
          assert.deepEqual(policy.visualModesUnchanged,['EXACT_COUNT','REPRESENTATIVE','DECORATIVE']);
          assert.equal(m.enabled,false);
          assert.equal(m.productionActivation,false);
          assert.equal(policy.constraints.studentDataWrites,false);
          console.log('PASS 10-form policy unchanged, 3 visual modes, no runtime activation');
          JS
