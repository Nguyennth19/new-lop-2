name: P1.4-B P1.2 Structural Archive No-Runtime QA
on:
  push:
    branches: [integration/p1-4-b-p12-structural-archive-20261119]
  pull_request:
    branches: [be-hoc]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nonplayable-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-locked archive bytes from P1.2-B (read only)
        shell: bash
        run: |
          set -euo pipefail
          source_commit=109300158378cbbf48a4724453cc1e555d7eaccd
          git cat-file -e "${source_commit}^{commit}"
          count=0
          while IFS= read -r f; do
            test -f "$f" || { echo "MISSING_ARCHIVE: $f"; exit 1; }
            current=$(git hash-object "$f")
            expected=$(git rev-parse "${source_commit}:$f")
            test "$current" = "$expected" || { echo "P1_2_ARCHIVE_BLOB_DRIFT: $f"; exit 1; }
            count=$((count+1))
          done < <(git ls-tree -r --name-only "$source_commit" -- du-lieu/bai-hoc/toan qa/p1-2 qa/p1-2-b)
          test "$count" -eq 73
          echo "P1_2_ARCHIVE_EXACT_SOURCE_BLOBS_PASS $count"
      - name: 24 V1+V2 byte-preserving packages, deny all student-ready
        run: node qa/p1-2/test_layered_packages.cjs
      - name: B001-B004 inherited DEV admission and policy regression
        run: |
          node qa/p1-2-b/test_checkpoint.cjs
          node qa/p1-2-b/test_content_hydration_and_admission.cjs
          node qa/p1-2-b/test_primary_pdf_evidence_and_visual_semantics.cjs
      - name: Revalidate existing P1.4 UX, orchestrator and P1.3 flag
        run: |
          node qa/be-hoc-ui/test_p1_4_ux_regression.cjs
          node qa/be-hoc-orchestrator/orchestrator-contract.test.cjs
          node qa/p1-3/test_p1_3_c2_gas_gate.cjs
