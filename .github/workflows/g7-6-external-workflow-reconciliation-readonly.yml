name: G7.6 external workflow reconciliation AUDIT ONLY
on:
  push:
    branches:
      - audit/g7-6-external-workflow-reconciliation-20261116
    paths:
      - 'qa/g7-6-external-workflow-reconciliation/**'
      - 'docs/kiem-dinh/G7.6_EXTERNAL_WORKFLOW_RECONCILIATION_*'
      - '.github/workflows/g7-6-external-workflow-reconciliation-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm Git ancestry and no protected file mutations
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 733422f11ddb415b2f898e2e38c009f6594401f1 HEAD
          if git diff --name-only 733422f11ddb415b2f898e2e38c009f6594401f1 HEAD | grep -Ev '^(qa/g7-6-external-workflow-reconciliation/|docs/kiem-dinh/G7\.6_EXTERNAL_WORKFLOW_RECONCILIATION_|\.github/workflows/g7-6-external-workflow-reconciliation-readonly.yml)' ; then echo OUT_OF_SCOPE; exit 1; fi
          for f in qa/g7-6-b6-c086/resolution.pending.v1.json qa/g7-6-b6/approvals/C08.approval.pending.v1.json qa/g7-6-b6/approvals/C09.approval.pending.v1.json du-lieu/g7-6/resource-renderer-manifest.v1.json appsscript.json; do
             test "$(git hash-object "$f")" = "$(git show 733422f11ddb415b2f898e2e38c009f6594401f1:"$f" | git hash-object --stdin)"
          done
      - name: Validate exact source crosswalk counts and no-go flags
        run: |
          node --check qa/g7-6-external-workflow-reconciliation/reconciliation.test.cjs
          node qa/g7-6-external-workflow-reconciliation/reconciliation.test.cjs
      - name: Preserve audit metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G76-EXTERNAL-WORKFLOW-CROSSWALK-NO-DEPLOY
          path: |
            qa/g7-6-external-workflow-reconciliation/*.json
            qa/g7-6-external-workflow-reconciliation/*.csv
            docs/kiem-dinh/G7.6_EXTERNAL_WORKFLOW_RECONCILIATION_20261116.md
          retention-days: 30
