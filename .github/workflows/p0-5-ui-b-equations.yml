name: P0.5 UI-B Equation and Feedback Regression (TEST only)
on:
  push:
    branches:
      - 'test/p0-5-ui-b-equations-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-b-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify UI-B feedback and equation layout contract
        run: node thu-nghiem/p0-5/ui-b/kiem-thu-ui-b.cjs
      - name: Keep UI-A mobile layout regression
        run: node thu-nghiem/p0-5/ui-a/kiem-thu-layout.cjs
      - name: Inherited P0.4 FULL_SAFE regression
        run: node thu-nghiem/p0-4/qa-runner.cjs FULL_SAFE
      - name: B20 exact 30 question regression
        run: node thu-nghiem/bai-20-bien-the/kiem-tra-hoi-quy.js
      - name: Ensure clean tracked repository after tests
        run: test -z "$(git status --porcelain --untracked-files=no)"
