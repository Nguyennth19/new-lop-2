name: G7.6 AI Workflow Orchestration V1 (READ ONLY)
on:
  push:
    branches:
      - audit/g7-6-ai-workflow-orchestration-v1-20261116
    paths:
      - 'qa/g7-6-ai-workflow-orchestration-v1/**'
      - 'docs/kiem-dinh/G7.6_AI_WORKFLOW_ORCHESTRATION_*'
      - '.github/workflows/g7-6-ai-workflow-orchestration-v1-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce no mutation outside isolated audit namespace
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 11d691aa9e5f82f27b8df664ee710b17009d5600 HEAD
          if git diff --name-only 11d691aa9e5f82f27b8df664ee710b17009d5600 HEAD | grep -Ev '^(qa/g7-6-ai-workflow-orchestration-v1/|docs/kiem-dinh/G7\.6_AI_WORKFLOW_ORCHESTRATION_|\.github/workflows/g7-6-ai-workflow-orchestration-v1-readonly.yml)' ; then echo PROTECTED_SOURCE_CHANGED; exit 1; fi
          test ! -e PROJECT_RULES.md
          for f in qa/g7-6-b6-c086/resolution.pending.v1.json qa/g7-6-workflow-rules-consolidation-review/owner-review.pending.v1.json du-lieu/g7-6/resource-renderer-manifest.v1.json qa/g7-6-b6/approvals/C08.approval.pending.v1.json qa/g7-6-b6/approvals/C09.approval.pending.v1.json appsscript.json; do
            test "$(git hash-object "$f")" = "$(git show 11d691aa9e5f82f27b8df664ee710b17009d5600:"$f" | git hash-object --stdin)"
          done
      - name: Check pinned sources, minimal handoff, negative permissions
        run: |
          node --check qa/g7-6-ai-workflow-orchestration-v1/orchestration-validator.cjs
          node --check qa/g7-6-ai-workflow-orchestration-v1/orchestration.test.cjs
          node qa/g7-6-ai-workflow-orchestration-v1/orchestration.test.cjs
      - name: Save read-only artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LOP2-AI1-CONTEXT-HANDOFF-READONLY-NO-DEPLOY
          path: |
            qa/g7-6-ai-workflow-orchestration-v1/*.json
            docs/kiem-dinh/G7.6_AI_WORKFLOW_ORCHESTRATION_V1_20261116.md
          retention-days: 30
