name: BE-HOC D2 automatic carry and 3/4 operand QA
on:
  push:
    branches: [be-hoc]
    paths:
      - '51_D2_AutoCarry.html'
      - '49_D2V12_BaiHoc.html'
      - '50_CSS_D2V12.html'
      - 'GiaoDien.html'
      - 'qa/be-hoc-d2-auto/**'
      - '.github/workflows/be-hoc-d2-auto-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-and-desktop-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable D2 and protected legacy grading
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object 47_D2V12_Core.html)" = 16ae440618bcb3cf90706cdad2ccd11cbadc222a
          test "$(git hash-object 48_D2V12_View.html)" = 214b615d0c595dfd76695c75e5443cefc36a921d
          for f in MayChu.gs 26_ChamCauHoiToan.html ThanhTichMayChu.gs appsscript.json; do
            test "$(git hash-object "$f")" = "$(git show 72d52c32aa81e37e989629c11c7f892b65d612a2:"$f" | git hash-object --stdin)"
          done
      - run: node qa/be-hoc-d2-auto/d2-auto.test.cjs
      - run: node qa/be-hoc-d2-auto/private-scoring-policy.test.cjs
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node qa/be-hoc-d2-auto/d2-auto.browser.test.cjs
