name: MASTER-BE-HOC commit backup (opt-in)
on:
  push:
    branches:
      - be-hoc
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: master-be-hoc-backup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  commit-snapshot:
    # SAFE DEFAULT: two owner-controlled variables must be true: backup enabled AND storage policy approved.
    if: ${{ vars.MASTER_BE_HOC_BACKUP_ENABLED == 'true' && vars.MASTER_BE_HOC_RETENTION_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout immutable triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backup-only Drive client
        run: python -m pip install "google-api-python-client==2.154.0" "google-auth==2.36.0"

      - name: Create snapshot, verify and upload to private Drive
        env:
          MASTER_BE_HOC_DRIVE_FOLDER_ID: ${{ vars.MASTER_BE_HOC_DRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: python scripts/master_be_hoc_backup.py

  one-time-export:
    # Manual controlled A1 export: only the explicitly tagged push, never recurring.
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[A1_EXPORT_ONCE]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout triggering commit without persisted credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Make immutable source ZIP + manifest (no upload to Drive, no deployment)
        run: python3 scripts/master_be_hoc_backup.py --dry-run
      - name: Retain export only briefly for controlled handoff
        uses: actions/upload-artifact@v4
        with:
          name: a1-source-snapshot-${{ github.sha }}
          path: dist/master-be-hoc-backup/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  reference-branches-export:
    # One-time A1 archival job for reference branches, not a release/deployment.
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[A1_EXPORT_MAIN_TEST_ONCE]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [main, test-theo-main]
    steps:
      - name: Checkout pinned reference branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target }}
          path: target
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout A1 snapshot tool from triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tools
          fetch-depth: 1
          persist-credentials: false
      - name: Export target branch exact SHA without Drive credentials
        run: |
          cd target
          GITHUB_SHA="" GITHUB_REF_NAME="${{ matrix.target }}" python3 ../tools/scripts/master_be_hoc_backup.py --dry-run --out ../out
      - name: Produce short-lived reference snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: a1-ref-${{ matrix.target }}-${{ github.run_id }}
          path: out/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
