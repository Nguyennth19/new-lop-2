name: G7.4 Count Evidence + B6 Batch Stager QA
on:
  push:
    branches:
      - test/g7-4-b5-11-count-evidence-b6-batch-import-20261113
    paths:
      - 'qa/g7-4-b6-batch-import/**'
      - 'qa/g7-4-b6-real-lesson-scenarios.v1.json'
      - 'qa/g7-4-gates/**'
      - 'qa/g7-4-b5-10-count-safe-matrix.v1.json'
      - '.github/workflows/g7-4-b511-batch-import-qa.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check qa/g7-4-gates/count-expansion-gates.cjs
          node --check qa/g7-4-b6-batch-import/stage-batch.cjs
          node --check qa/g7-4-b6-batch-import/stage-batch.test.cjs
          node --check qa/g7-4-b6-batch-import/cross-subject.test.cjs
      - name: Pure Count-Safe and Expansion tests
        run: node qa/g7-4-gates/count-expansion-gates.test.cjs
      - name: Real cross-subject scenario tests
        run: node qa/g7-4-b6-batch-import/cross-subject.test.cjs
      - name: Batch importer adversarial and rollback tests
        run: node qa/g7-4-b6-batch-import/stage-batch.test.cjs
      - name: Never activate user runtime
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const m=JSON.parse(fs.readFileSync('hinh-anh/svg-fallback/fluent-emoji-flat/v1/manifest.v1.json','utf8'));
          assert.equal(m.icons.length,46);
          assert.equal(m.icons.filter(x=>x.countQaStatus==='COUNT_SAFE_APPROVED').length,0);
          assert.equal(m.enabled,false);
          assert.equal(m.productionActivation,false);
          console.log('PASS — 46 SVG remain staging-only, count permissions OFF');
          JS
