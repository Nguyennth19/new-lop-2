name: P0.5-H Pedagogical Content QA (TEST only)
on:
  push:
    branches:
      - 'test/p0-5-h-pedagogy-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent 30-question academic data audit
        run: |
          node thu-nghiem/p0-5/closure/audit-pedagogy-b20.cjs > "$RUNNER_TEMP/audit-p05h.json"
          node -e "const r=require(process.argv[1]).result;const exp=['VAR_B20_20261112_004','VAR_B20_20261112_007','VAR_B20_20261112_010','VAR_B20_20261112_022','VAR_B20_20261112_024','VAR_B20_20261112_026','VAR_B20_20261112_030'];const found=r.advisoryFindings.map(x=>x.questionId).sort();if(r.questionCount!==30||r.arithmeticPassed!==30||r.technicalErrors.length!==0||r.pedagogySignoff!=='UNSIGNED'||JSON.stringify(found)!==JSON.stringify(exp))process.exit(1);console.log(JSON.stringify({status:r.status,total:r.questionCount,mathCorrect:r.arithmeticPassed,technicalErrors:r.technicalErrors.length,reviewQuestions:r.reviewQuestionCount,reviewIds:found,signoff:r.pedagogySignoff}));" "$GITHUB_WORKSPACE/thu-nghiem/p0-5/closure/audit-pedagogy-b20.cjs"
      - name: Inherited B20 renderer and wrong-answer QA
        run: node thu-nghiem/bai-20-bien-the/kiem-tra-hoi-quy.js
      - name: Inherited UI and no-write FULL_SAFE regression
        run: node thu-nghiem/p0-4/qa-runner.cjs FULL_SAFE
      - name: Pedagogical signoff still explicitly blocked
        run: |
          set -euo pipefail
          if node thu-nghiem/p0-5/release-gate.cjs thu-nghiem/p0-5/evidence-current.json > "$RUNNER_TEMP/release-p05h.json"; then
            echo "Unexpected release-ready for unsigned curriculum"
            exit 1
          fi
          node -e "const e=JSON.parse(require('fs').readFileSync(process.argv[1]));if(e.releaseReady||e.gates.PEDAGOGY.status!=='FAIL')process.exit(1);console.log('PASS fail-closed pedagogy gate');" "$RUNNER_TEMP/release-p05h.json"
      - name: No tracked repository changes
        run: test -z "$(git status --porcelain --untracked-files=no)"
