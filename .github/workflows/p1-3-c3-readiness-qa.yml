name: P1.3-C.3 Live GAS Readiness and Rollback DRY RUN
on:
  push:
    branches:
      - 'audit/p1-3-c3-live-gas-acceptance-20261119'
    paths:
      - 'qa/p1-3/**'
      - '.github/workflows/p1-3-c3-readiness-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c3-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Source P1.3-A PNG SHA256 integrity
        run: node qa/p1-3/test_png_master_288.cjs
      - name: Character 35 source root
        run: node qa/p1-3/test_p1_3_b_characters.cjs
      - name: Unified resolver contract
        run: node qa/p1-3/test_p1_3_c_unified_resolver.cjs
      - name: Fluent fail-closed adapter regression
        run: node qa/p1-3/test_p1_3_c1_fluent_hardening.cjs
      - name: GAS TEST OFF and sidecar integration
        run: node qa/p1-3/test_p1_3_c2_gas_gate.cjs
      - name: Simulated OFF ON OFF rollback kill switch
        run: node qa/p1-3/test_p1_3_c3_rollback_drill.cjs
      - name: Syntax validation of live browser acceptance (NOT execution)
        run: node --check qa/p1-3/test_p1_3_c3_live_gas.cjs
