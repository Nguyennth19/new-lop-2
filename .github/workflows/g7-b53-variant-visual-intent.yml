name: G7.4-B.5.3 Variant Visual Intent JSON QA
on:
  push:
    branches:
      - test/g7-4-b5-3-visual-intent-variant-data-20261113
    paths:
      - 'BienTheVisualIntentChung.gs'
      - 'du-lieu/bien-the/chuan/**'
      - 'qa/g7-4-b5-3/**'
      - '.github/workflows/g7-b53-variant-visual-intent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  variant-contract-and-b20-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Standard variant data projection and cross-lesson selection QA
        run: node qa/g7-4-b5-3/test-variant-visual-intent.cjs
      - name: Shared semantic selector B5.1 baseline
        run: node qa/g7-4-b5-1/test-shared-selector.cjs
      - name: Original B20 renderer and grading across 30 questions and six sessions
        run: node thu-nghiem/bai-20-bien-the/kiem-tra-hoi-quy.js
      - name: Legacy fallback, visual states and exact CSS hashes
        run: |
          node qa/g7-4-b3-1/test-controlled-merge.cjs
          node qa/g7-4-b3-1/test-visual-fallback.cjs
          node qa/hotfix-b20-book/test-book-illustration.cjs
      - name: Validate Apps Script JavaScript syntax
        run: |
          cp BienTheVisualIntentChung.gs /tmp/g7-b53-variant.cjs
          node --check /tmp/g7-b53-variant.cjs
