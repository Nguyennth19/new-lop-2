name: P0.6-E.0.1 Math Variant QA Gates (TEST only)
on:
  push:
    branches:
      - 'test/p0-6-e01-math-variant-validator-*'
    paths:
      - 'thu-nghiem/p0-6/**'
      - '.github/workflows/p0-6-e01-math-variant-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  math-variant-policy-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: E.0.1 math variant G0-G8 positive negative and review cases
        run: node thu-nghiem/p0-6/kiem-thu-math-variant-policy-v1.cjs
      - name: E multi-lesson pipeline
        run: node thu-nghiem/p0-6/kiem-thu-multi-lesson-v1.cjs
      - name: D renderer parity
        run: node thu-nghiem/p0-6/kiem-thu-renderer-registry-v1.cjs
      - name: C grading and receipts
        run: node thu-nghiem/p0-6/kiem-thu-qa-grading-v1.cjs
      - name: B adapter registry
        run: node thu-nghiem/p0-6/kiem-thu-adapter-registry-v1.cjs
      - name: A lesson contract
        run: node thu-nghiem/p0-6/kiem-thu-contract-v1.cjs
      - name: P0.4 inherited FULL_SAFE
        run: node thu-nghiem/p0-4/qa-runner.cjs FULL_SAFE
      - name: B20 original regression
        run: node thu-nghiem/bai-20-bien-the/kiem-tra-hoi-quy.js
      - name: P0.5 release gate fail closed
        run: |
          if node thu-nghiem/p0-5/release-gate.cjs thu-nghiem/p0-5/evidence-current.json; then
            echo 'FAIL: release gate unexpectedly open'; exit 1
          fi
      - name: No tracked modifications
        run: test -z "$(git status --porcelain --untracked-files=no)"
