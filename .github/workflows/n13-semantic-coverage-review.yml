name: N13 semantic coverage source-only delta
on:
  push:
    branches: [prep/n13-semantic-coverage-20261124]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node qa/n13-semantic-coverage/build-pilot-gas.cjs --check
      - run: node --test qa/n13-semantic-coverage/pilot-gas.test.cjs
      - name: Browser regression of corrected instruction
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node qa/n13-semantic-coverage/pilot-http.test.cjs
