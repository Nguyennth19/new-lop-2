name: ULT N4-FINAL-A consolidated D10 pedagogy / accessibility LAB QA
on:
  push:
    branches: ['lab/ult-n4-final-a-technical-policy-20261123']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  technical-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze original core and validate LAB contracts
        run: |
          set -euo pipefail
          node --check qa/universal-template-n4-prep/n4-final-a-d10-pedagogy-a11y.test.cjs
          node qa/universal-template-v1/build.cjs
          node qa/universal-template-v1/contracts.test.cjs
      - name: Install Chrome test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo 'ULT_SYSTEM_CHROME=1' >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: D10 +/- pedagogical and accessibility observables
        run: node qa/universal-template-n4-prep/n4-final-a-d10-pedagogy-a11y.test.cjs
      - name: N1-A and R1/R2 baseline regression
        run: |
          node qa/universal-template-n1/n1a-browser.test.cjs
          node qa/universal-template-r12/hardening-browser.test.cjs
      - name: QA-only source scope
        if: always()
        run: |
          set -euo pipefail
          BASE=ed4c89704a2568903d5e24d836a9ef538898a56f
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          if git diff --name-only "$BASE" HEAD | grep -v -E '^(qa/universal-template-n4-prep/n4-final-a-.*|qa/universal-template-n4-prep/governance/N4_FINAL_A_.*|qa/universal-template-n4-prep/governance/MASTER_QA_INDEX_N4C7_20261123\.md|\.github/workflows/ult-n4-final-a\.yml)$'; then
            echo 'N4_FINAL_A_SOURCE_SCOPE_BREACH' >&2; exit 1
          fi
          echo 'No runtime/CSS or production changes; technical QA only' >> "$GITHUB_STEP_SUMMARY"
      - name: Archive scoped browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: N4_FINAL_A_D10_PEDAGOGY_A11Y_NO_HUMAN_SIGNOFF
          path: |
            qa/universal-template-n4-prep/dist/N4_FINAL_A/
            qa/universal-template-n1/dist/
            qa/universal-template-r12/dist/
          if-no-files-found: warn
          retention-days: 90
