name: ULT N4-A.2 live-origin pinned image smoke (SEPARATE NETWORK GATE)
on:
  push:
    branches:
      - 'lab/ult-n4a-real-binary-qa-20261123'
    paths:
      - 'qa/universal-template-n4-prep/n4a-live-origin-smoke.cjs'
      - '.github/workflows/ult-n4a-live-origin-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  origin-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare runner and pin sources
        run: |
          node --check qa/universal-template-n4-prep/n4a-live-origin-smoke.cjs
          node qa/universal-template-n4-prep/n4-preflight.cjs
          npm install --no-save --no-package-lock playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo 'ULT_SYSTEM_CHROME=1' >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Fetch immutable GitHub RAW URL and browser decode exact bytes
        run: node qa/universal-template-n4-prep/n4a-live-origin-smoke.cjs
      - name: Save standalone external-network evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: N4A_LIVE_ORIGIN_SMOKE_EVIDENCE_NO_RELEASE
          path: qa/universal-template-n4-prep/dist/N4A_LIVE_ORIGIN_EVIDENCE.json
          if-no-files-found: error
          retention-days: 90
      - name: Explicit no-release note
        if: always()
        run: |
          echo 'Smoke is independent and may fail due to network. No UI/physical device acceptance.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No source changes, merge, GAS/Sheet writes, V1.3-C or student release.' >> "$GITHUB_STEP_SUMMARY"
