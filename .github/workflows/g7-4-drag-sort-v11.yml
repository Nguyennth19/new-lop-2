name: G7.4 Drag Sort Reference V1.1 TEST
on:
  push:
    branches:
      - test/g7-4-drag-sort-reference-v11-20261114
    paths:
      - 'qa/g7-4-drag-sort-reference-v11/**'
      - '.github/workflows/g7-4-drag-sort-v11.yml'
  workflow_dispatch:
jobs:
  drag-sort-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Order and sorting state, variation, SHA regression
        run: node qa/g7-4-drag-sort-reference-v11/drag-sort-v11.test.cjs
