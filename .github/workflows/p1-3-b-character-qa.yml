name: P1.3-B Character Source Audit (no deployment)
on:
  push:
    branches:
      - 'audit/p1-3-b-character-provenance-20261119'
      - 'audit/p1-3-b2-character-manifest-governance-20261119'
    paths:
      - 'qa/p1-3/**'
      - '.github/workflows/p1-3-b-character-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  character-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Revalidate P1.3-A PNG master SHA256 source pin
        run: node qa/p1-3/test_png_master_288.cjs
      - name: Validate 30 WebP character poses and 5 PNG source sheets
        run: node qa/p1-3/test_p1_3_b_characters.cjs
      - name: Preserve existing character semantics tests
        run: node qa/p1-3/test_characters_30.cjs
      - name: Validate P1.3-B.2 manifest and fail-closed runtime semantic contract
        run: node qa/p1-3/test_p1_3_b2_governance.cjs
      - name: Upload P1.3-B GitHub character SHA256 manifest
        uses: actions/upload-artifact@v4
        with:
          name: p1-3-b-character-github-sha256
          path: qa/p1-3/output/p1-3-b-character-github-sha256.json
          if-no-files-found: error
