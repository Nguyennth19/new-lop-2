name: G7.4 Pure Visual Resolver — TEST only
on:
  push:
    branches: [test/g7-4-b5-8r-pure-visual-resolver-20261113]
    paths:
      - 'BoDieuPhoiHinhAnhG74Test.gs'
      - 'qa/g7-4-visual-resolver/**'
      - '.github/workflows/g7-pure-visual-resolver.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  pure-resolver-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: New pure resolver contract and fail-closed cases
        run: node qa/g7-4-visual-resolver/test-pure-resolver.cjs
      - name: GAS module syntax
        run: |
          cp BoDieuPhoiHinhAnhG74Test.gs /tmp/G74VisualResolver.cjs
          node --check /tmp/G74VisualResolver.cjs
      - name: Original 288 labels, test gallery and count compositing
        run: |
          node qa/g7-4-b5-7-perf-a/test-owner-label-approval.cjs
          node qa/g7-4-b5-7/test-288-library.cjs
          node qa/g7-4-b5-7-perf-a/test-gallery-performance.cjs
          node qa/g7-4-b5-8/test-semantic-count-composition.cjs
      - name: Previous standalone visual and multi-lesson gates
        run: |
          node qa/g7-4-b5-6/test-standalone-visual.cjs
          node qa/g7-4-b5-5/test-multi-lesson-gate.cjs
      - name: B20 six sessions, CSS and fallback
        run: |
          node thu-nghiem/bai-20-bien-the/kiem-tra-hoi-quy.js
          node qa/g7-4-b3-1/test-controlled-merge.cjs
          node qa/g7-4-b3-1/test-visual-fallback.cjs
          node qa/hotfix-b20-book/test-book-illustration.cjs
