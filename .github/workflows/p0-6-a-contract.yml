name: P0.6-A Lesson Contract (TEST only)
on:
  push:
    branches:
      - 'test/p0-6-platform-foundation-*'
    paths:
      - 'thu-nghiem/p0-6/**'
      - '.github/workflows/p0-6-a-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: P0.6-A multi-subject fixtures and B20 invariants
        run: node thu-nghiem/p0-6/kiem-thu-contract-v1.cjs
      - name: Inherited P0.4 FULL_SAFE
        run: node thu-nghiem/p0-4/qa-runner.cjs FULL_SAFE
      - name: B20 original complete regression
        run: node thu-nghiem/bai-20-bien-the/kiem-tra-hoi-quy.js
      - name: P0.5 gate remains fail-closed
        run: |
          if node thu-nghiem/p0-5/release-gate.cjs thu-nghiem/p0-5/evidence-current.json; then
            echo "Unexpected release-ready"; exit 1
          fi
      - name: No tracked file mutations
        run: test -z "$(git status --porcelain --untracked-files=no)"
