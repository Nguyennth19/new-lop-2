name: G7.4 Geometry Tangram Reference V1.1 TEST
on:
  push:
    branches:
      - test/g7-4-geometry-tangram-reference-v11-20261114
    paths:
      - 'qa/g7-4-geometry-tangram-reference-v11/**'
      - '.github/workflows/g7-4-geometry-tangram-v11.yml'
  workflow_dispatch:
jobs:
  geometry-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Two mode contract, state, source and safety tests
        run: node qa/g7-4-geometry-tangram-reference-v11/geometry-v11.test.cjs
