name: G7.6 B6 C08.4 owner signature conditional TEST gate (NO DEPLOY)
on:
  push:
    branches:
      - test/g7-6-b6-c084-owner-signoff-conditional-gate-20261116
    paths:
      - 'qa/g7-6-b6-c084/**'
      - 'docs/kiem-dinh/G7.6-B6-C084_*'
      - '.github/workflows/g7-6-b6-c084-no-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: Nguyennth19/new-lop-2
          ref: c0c5620f30edd92ab45d4ec87a8a07ffa38948e2
          path: _external/p06
          persist-credentials: false
      - name: Protected baseline and no-deploy source guard
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 342e517b83893a5fc1a540f8dc6299dd7667c4f9 HEAD
          if git diff --name-only 342e517b83893a5fc1a540f8dc6299dd7667c4f9 HEAD | grep -Ev '^(qa/g7-6-b6-c084/|docs/kiem-dinh/G7\.6-B6-C084_|\.github/workflows/g7-6-b6-c084-no-deploy.yml)' ; then echo PROTECTED_PATH_CHANGED;exit 1; fi
          for f in qa/g7-6-b6-c083/e04-owner-options.v1.json qa/g7-6-b6-c083/skill-id-owner-options.v1.json qa/g7-6-b6-c083/checkpoint.c083.v1.json qa/g7-6-b6-c082/source-item-review.v1.json qa/g7-6-b6/approvals/C08.approval.pending.v1.json qa/g7-6-b6/approvals/C09.approval.pending.v1.json du-lieu/g7-6/resource-renderer-manifest.v1.json; do
            test "$(git hash-object "$f")" = "$(git show 342e517b83893a5fc1a540f8dc6299dd7667c4f9:"$f" | git hash-object --stdin)"
          done
          test "$(git -C _external/p06 rev-parse HEAD)" = c0c5620f30edd92ab45d4ec87a8a07ffa38948e2
      - name: Exact scope and signed owner negative tests plus synthetic dry-run
        run: |
          node --check qa/g7-6-b6-c084/conditional-signoff-validator.cjs
          node --check qa/g7-6-b6-c084/c084-gate.test.cjs
          node qa/g7-6-b6-c084/c084-gate.test.cjs _external/p06
      - name: Audit artifact without real signatures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G76-B6-C084-UNSIGNED-OWNER-SIGNOFF-NO-TEST-REGISTRATION
          path: |
            qa/g7-6-b6-c084/*.json
            docs/kiem-dinh/G7.6-B6-C084_OWNER_SIGNOFF_GATE_20261116.md
          retention-days: 30
