<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G7.4 Dạng 6 TEST độc lập</title><link rel="stylesheet" href="drag-sort-v11.css"><style>body{margin:0;padding:16px;background:#fcf9e9;color:#243449;font:700 14px system-ui}main,header{max-width:900px;margin:12px auto;background:white;border-radius:16px;padding:16px}button.tab{padding:10px;margin-right:7px;border:2px solid #9ec3ec;background:#fff;border-radius:10px;cursor:pointer;font:inherit}button.tab.active{background:#4e49c8;color:white}</style></head>
<body><header><h1>Dạng 6 · Xếp thứ tự & Phân loại – TEST</h1><p>Không chấm, không cấp điểm, không ghi tiến độ. Hai phần có bản nháp riêng.</p><button class="tab active" id="order">1. Xếp thứ tự</button><button class="tab" id="sort">2. Phân loại giỏ</button><button class="tab" id="reset">Làm lại</button></header><main id="app"></main>
<script src="drag-sort-v11-core.js"></script><script src="drag-sort-v11-fixtures.js"></script><script src="drag-sort-v11-view.js"></script><script>
(function(){const f={ORDER:KLDragSortFixturesV11.ordering,SORT:KLDragSortFixturesV11.baskets};const nodes={ORDER:document.getElementById('order'),SORT:document.getElementById('sort')};let mode='ORDER',controller=null;const drafts={};
function start(next){if(controller){drafts[mode]=controller.snapshot();controller.destroy();}mode=next;const c=KLDragSortV11.compile(f[mode]);if(!c.ok){document.getElementById('app').textContent=c.reason;return;}controller=KLDragSortViewV11.mount(document.getElementById('app'),c.plan,{onChange:d=>{drafts[mode]=d}});if(drafts[mode])controller.restore(drafts[mode]);for(const [k,n] of Object.entries(nodes))n.classList.toggle('active',k===mode);}
for(const [k,n] of Object.entries(nodes))n.addEventListener('click',()=>{if(k!==mode)start(k)});
document.getElementById('reset').addEventListener('click',()=>{controller?.clear();drafts[mode]=controller.snapshot()});start(mode);
})();</script></body></html>
