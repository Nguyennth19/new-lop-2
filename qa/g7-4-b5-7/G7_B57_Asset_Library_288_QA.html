<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>G7.4-B.5.7 — 288 WebP QA</title><style>
body{font:15px system-ui;background:#f2f6fc;color:#183650;margin:0}header{background:#20589d;color:white;padding:25px}main{max-width:1280px;margin:auto;padding:16px}section{background:white;padding:16px;border-radius:14px;margin-bottom:13px;border:1px solid #d9e3ed}.controls{display:flex;gap:9px;flex-wrap:wrap}input,select,button{border:1px solid #bdccda;padding:9px;border-radius:9px;font:inherit}input{min-width:130px;flex:1}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}.card{padding:9px;border-radius:10px;border:1px solid #dce6ef}.preview{display:grid;place-items:center;min-height:135px;background:#f3f9ff}.preview img{max-height:125px;max-width:100%;object-fit:contain}small{display:block;color:#567086;overflow-wrap:anywhere}.msg{color:#856015;font-weight:bold}button{cursor:pointer}@media(max-width:650px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}section{padding:10px}}
</style></head><body><header><h1>G7.4-B.5.7 · Thư viện 288 WebP</h1><p>TEST độc lập · ảnh gốc, tải lỗi, fallback, lọc nhóm, biên bản JSON</p></header><main>
<section><p id="info">Đang tải registry 288 ảnh được khóa tại commit đã kiểm định…</p><p>288 Asset ID · 24 nhóm × 12 · không chạm Web App/Bài 20/MAIN</p><div class="controls"><input id="search" type="search" placeholder="Asset ID / nhãn"><select id="group"><option value="">Tất cả 24 nhóm</option></select><select id="approval"><option value="">Mọi trạng thái</option><option>LABEL_APPROVED</option><option>OWNER_SIGNOFF_PENDING</option></select></div><div class="controls" style="margin-top:10px"><button id="hide">Ẩn ảnh: OFF</button><button id="broken">Lỗi ảnh: OFF</button><button id="scan">Quét toàn bộ 288</button><button id="export">Xuất QA JSON</button></div><p id="counter"></p></section>
<section><div id="grid" class="cards"></div></section></main>
<script>
(()=>{
'use strict';
const RELEASE='653bfbc73002a188dcea0b714247b84cc28a4fed';
const REG='https://raw.githubusercontent.com/Nguyennth19/new-lop-2/bcb86bb3804fc33737e716b4e71c5656b922184d/du-lieu/asset-selector/asset-registry-288.v1.json';
const ROOT='https://raw.githubusercontent.com/Nguyennth19/new-lop-2/'+RELEASE+'/hinh-anh/webp-g7/v1/';
const $=x=>document.getElementById(x),states={},checked=new Set();let hidden=false,broken=false,valid=false;
const groups=['SH','M'].flatMap(t=>Array.from({length:12},(_,i)=>t+String(i+1).padStart(2,'0')));
const fake=groups.flatMap(g=>Array.from({length:12},(_,i)=>({asset_id:'KL_'+g+'_'+String(i+1).padStart(3,'0'),label_vi:'Nhãn chưa tải',label_status:'UNAVAILABLE',relative_path:'WEBP/'+g+'/KL-'+g+'-'+String(i+1).padStart(2,'0')+'.webp'})));
let items=fake;
const groupOf=x=>x.asset_id.split('_')[1];
function fallback(node,id){node.replaceChildren();node.textContent='🖼️ Lỗi ảnh / fallback · '+id}
function img(node,a){if(!valid||hidden){fallback(node,a.asset_id);return}let i=new Image();i.loading='lazy';i.alt=a.label_vi;i.onload=()=>{states[a.asset_id]='loaded';node.replaceChildren(i);update()};i.onerror=()=>{states[a.asset_id]='failed';fallback(node,a.asset_id);update()};i.src=broken?'data:image/webp;base64,INVALID':ROOT+a.relative_path}
function matches(a){let q=$('search').value.toLowerCase();return (!q||a.asset_id.toLowerCase().includes(q)||a.label_vi.toLowerCase().includes(q))&&(!$('group').value||groupOf(a)===$('group').value)&&(!$('approval').value||a.label_status===$('approval').value)}
function update(){$('counter').textContent=Object.values(states).filter(x=>x==='loaded').length+' tải tốt · '+Object.values(states).filter(x=>x==='failed').length+' lỗi · '+checked.size+' đã xem'}
function render(){let filtered=items.filter(matches);$('grid').replaceChildren();const frag=document.createDocumentFragment();for(const a of filtered){let card=document.createElement('article');card.className='card';let slot=document.createElement('div');slot.className='preview';let name=document.createElement('b');name.textContent=a.asset_id;let label=document.createElement('small');label.textContent=a.label_vi;let path=document.createElement('small');path.textContent=a.relative_path;let badge=document.createElement('small');badge.textContent=a.label_status;let review=document.createElement('label');let cb=document.createElement('input');cb.type='checkbox';cb.checked=checked.has(a.asset_id);cb.onchange=()=>{cb.checked?checked.add(a.asset_id):checked.delete(a.asset_id);update()};review.append(cb,' Đã xem');card.append(slot,name,label,badge,path,review);frag.append(card);img(slot,a)}$('grid').append(frag);update()}
function registryOkay(data){if(!data||data.release_commit!==RELEASE||data.total!==288||!Array.isArray(data.assets)||data.assets.length!==288)return false;const ids=new Set(),paths=new Set(),n={};for(const a of data.assets){const m=/^KL_(SH|M)(\d{2})_(\d{3})$/.exec(a.asset_id),p=/^WEBP\/(SH|M)(\d{2})\/KL-(SH|M)(\d{2})-(\d{2})\.webp$/.exec(a.relative_path);if(!m||!p||m[1]!==p[1]||m[2]!==p[2]||m[1]!==p[3]||m[2]!==p[4]||Number(m[3])!==Number(p[5])||ids.has(a.asset_id)||paths.has(a.relative_path)||!a.label_vi||!['LABEL_APPROVED','OWNER_SIGNOFF_PENDING'].includes(a.label_status))return false;ids.add(a.asset_id);paths.add(a.relative_path);n[groupOf(a)]=(n[groupOf(a)]||0)+1}return Object.keys(n).length===24&&Object.values(n).every(x=>x===12)}
for(const g of groups){const o=document.createElement('option');o.value=g;o.textContent=g;$('group').append(o)}
$('search').oninput=render;$('group').onchange=render;$('approval').onchange=render;
$('hide').onclick=()=>{hidden=!hidden;$('hide').textContent='Ẩn ảnh: '+(hidden?'ON':'OFF');render()};$('broken').onclick=()=>{broken=!broken;Object.keys(states).forEach(k=>delete states[k]);$('broken').textContent='Lỗi ảnh: '+(broken?'ON':'OFF');render()};
$('scan').onclick=async()=>{if(!valid)return;let i=0;const worker=async()=>{while(i<items.length){const a=items[i++];await new Promise(done=>{const img=new Image();img.onload=()=>{states[a.asset_id]='loaded';done()};img.onerror=()=>{states[a.asset_id]='failed';done()};img.src=broken?'data:image/webp;base64,INVALID':ROOT+a.relative_path})}};await Promise.all(Array.from({length:6},worker));update()};
$('export').onclick=()=>{const payload={stage:'G7.4-B.5.7',timestamp:new Date().toISOString(),registryVerified:valid,release:RELEASE,total:items.length,assets:items.map(a=>({assetId:a.asset_id,label:a.label_vi,approval:a.label_status,relativePath:a.relative_path,load:states[a.asset_id]||'unloaded',checked:checked.has(a.asset_id)}))};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const x=document.createElement('a');x.href=url;x.download='G7_B57_QA_288.json';x.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
render();fetch(REG).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{if(!registryOkay(data))throw Error('REGISTRY_INVALID');valid=true;items=data.assets;$('info').textContent='288/288 ID hợp lệ · 100 nhãn đã duyệt · 188 nhãn chờ duyệt · 24 nhóm';render()}).catch(err=>{$('info').textContent='Không tải được registry ('+err.message+'). Đang hiển thị ID dự phòng; chưa thể xác minh nhãn và ảnh thật.'});
})();
</script></body></html>
