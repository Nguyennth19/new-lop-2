<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>N13.2-B DEV review only</title><link rel="stylesheet" href="semantic-view.css"></head><body style="margin:0;padding:12px;font-family:system-ui"><p><strong>DEV REVIEW ONLY — Không chấm điểm, không đưa vào Full App.</strong></p><label for="pick">Ứng viên tổng hợp:</label> <select id="pick"></select><label><input id="fallback" type="checkbox"> Fallback dạng văn bản</label><main id="host"></main><p id="speech" aria-live="polite"></p><script src="../../44_G75_NormalizerToanV2.html"></script><script src="semantic-core.cjs"></script><script src="semantic-view.js"></script><script>fetch('candidates.review.json').then(r=>{if(!r.ok)throw Error('DATA');return r.json()}).then(rows=>{const pick=document.getElementById('pick'),fallback=document.getElementById('fallback'),host=document.getElementById('host'),speech=document.getElementById('speech');rows.forEach((r,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=r.variantId+' · '+r.preview.kind;pick.append(o)});function show(){speech.textContent='';N13SemanticView.mount(host,rows[Number(pick.value)].preview,{fallback:fallback.checked,onSpeak:parts=>{speech.textContent=parts.map(p=>p.text).join(' ');if('speechSynthesis'in window){speechSynthesis.cancel();for(const p of parts){const u=new SpeechSynthesisUtterance(p.text);u.lang='vi-VN';u.rate=p.rate||.9;u.pitch=p.pitch||1;speechSynthesis.speak(u)}}}})}pick.onchange=fallback.onchange=show;show()}).catch(()=>document.getElementById('host').textContent='Không tải được dữ liệu DEV. Mở qua máy chủ HTTP cục bộ từ repository root; không dùng Full App.');</script></body></html>
