<script>fetch('/synth5-prompt-delta.review.json').then(r=>{if(!r.ok)throw Error('DELTA_NOT_FOUND');return r.json();}).then(delta=>{const host=document.querySelector('#host'),speech=document.querySelector('#speech');window.N13B1View.mount(host,delta.question.reviewDto.parts,{onSpeak:parts=>{speech.textContent=parts.map(p=>p.text).join(' ');if('speechSynthesis'in window){speechSynthesis.cancel();for(const p of parts){const u=new SpeechSynthesisUtterance(p.text);u.lang='vi-VN';u.rate=p.rate||.9;u.pitch=p.pitch||1;speechSynthesis.speak(u);}}}});window.__N13ready=true;}).catch(e=>{document.querySelector('#host').textContent='Không tải được delta QA.';window.__N13error=String(e);});</script></body></html>
