<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N13 final two-lesson DEV review</title><link rel="stylesheet" href="semantic-view.css"><link rel="stylesheet" href="b1-composite.css"></head><body style="margin:0;padding:12px;font-family:system-ui"><p><strong>DEV REVIEW ONLY — không chấm điểm, không phải bài SGK nguyên văn.</strong></p><label for="pick">Mẫu:</label> <select id="pick"></select> <label><input type="checkbox" id="fallback"> Fallback văn bản</label><main id="host"></main><p id="speech" aria-live="polite"></p><script src="../../44_G75_NormalizerToanV2.html"></script><script src="../../66_D3_Core.html"></script><script src="../../68_D4_Core.html"></script><script src="../../69_D4_View.html"></script><script src="semantic-core.cjs"></script><script src="semantic-view.js"></script><script src="b1-composite-core.cjs"></script><script src="b1-composite-view.js"></script><script>fetch('pilot-lessons.review.json').then(r=>{if(!r.ok)throw Error('DATA');return r.json()}).then(pack=>{const rows=pack.lessons.flatMap(l=>l.questions.map(q=>({id:q.variantId,lessonId:q.lessonId,parts:q.reviewDto.parts})));const pick=document.querySelector('#pick'),fallback=document.querySelector('#fallback'),host=document.querySelector('#host'),speech=document.querySelector('#speech');for(const [i,r] of rows.entries()){const o=document.createElement('option');o.value=String(i);o.textContent=r.id+' · '+r.lessonId;pick.append(o)}function show(){if('speechSynthesis'in window)speechSynthesis.cancel();speech.textContent='';N13B1View.mount(host,rows[Number(pick.value)].parts,{fallback:fallback.checked,onSpeak:parts=>{speech.textContent=parts.map(p=>p.text).join(' ');if('speechSynthesis'in window){speechSynthesis.cancel();for(const p of parts){const u=new SpeechSynthesisUtterance(p.text);u.lang='vi-VN';u.rate=p.rate||.9;u.pitch=p.pitch||1;speechSynthesis.speak(u)}}}})}pick.onchange=fallback.onchange=show;show()}).catch(()=>document.querySelector('#host').textContent='Không tải được dữ liệu. Mở bằng HTTP cục bộ từ repository root.');</script></body></html>
