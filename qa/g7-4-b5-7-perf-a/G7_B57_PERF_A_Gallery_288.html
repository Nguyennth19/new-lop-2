<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>G7.4-B.5.7-PERF-A — 288 WebP QA</title><style>
body{font:15px system-ui;background:#f2f6fc;color:#183650;margin:0}header{background:#20589d;color:white;padding:25px}main{max-width:1280px;margin:auto;padding:16px}section{background:white;padding:16px;border-radius:14px;margin-bottom:13px;border:1px solid #d9e3ed}.controls{display:flex;gap:9px;flex-wrap:wrap}input,select,button{border:1px solid #bdccda;padding:9px;border-radius:9px;font:inherit}input{min-width:130px;flex:1}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}.card{padding:9px;border-radius:10px;border:1px solid #dce6ef}.preview{display:grid;place-items:center;min-height:135px;background:#f3f9ff}.preview img{max-height:125px;max-width:100%;object-fit:contain}small{display:block;color:#567086;overflow-wrap:anywhere}.msg{color:#856015;font-weight:bold}button{cursor:pointer}@media(max-width:650px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}section{padding:10px}}
</style></head><body><header><h1>G7.4-B.5.7 · Thư viện 288 WebP</h1><p>TEST độc lập · ảnh gốc, tải lỗi, fallback, lọc nhóm, biên bản JSON</p></header><main>
<section><p id="info">Đang tải registry 288 ảnh được khóa tại commit đã kiểm định…</p><p>288 Asset ID · 24 nhóm × 12 · không chạm Web App/Bài 20/MAIN</p><div class="controls"><input id="search" type="search" placeholder="Asset ID / nhãn"><select id="group"><option value="">Tất cả 24 nhóm</option></select><select id="approval"><option value="">Mọi trạng thái</option><option>LABEL_APPROVED</option><option>OWNER_SIGNOFF_PENDING</option></select></div><div class="controls" style="margin-top:10px"><button id="hide">Ẩn ảnh: OFF</button><button id="broken">Lỗi ảnh: OFF</button><button id="scan">Quét toàn bộ 288 (3 luồng)</button><select id="pageSize"><option value="12">12 ảnh/trang</option><option value="24">24 ảnh/trang</option></select><button id="prev">Trang trước</button><span id="pageCount"></span><button id="next">Trang sau</button><button id="export">Xuất QA JSON</button></div><p id="counter"></p><p id="timeStats">Chưa có dữ liệu thời gian tải</p></section>
<section><div id="grid" class="cards"></div></section></main>
<script>
(()=>{
'use strict';
const RELEASE='653bfbc73002a188dcea0b714247b84cc28a4fed';
const REG='https://raw.githubusercontent.com/Nguyennth19/new-lop-2/b411774211c490c76cc9aaa110d6053e07da3ed3/du-lieu/asset-selector/asset-registry-288.v1.json';
const ROOT='https://raw.githubusercontent.com/Nguyennth19/new-lop-2/'+RELEASE+'/hinh-anh/webp-g7/v1/';
const $=id=>document.getElementById(id),groupOf=a=>a.asset_id.split('_')[1],states=new Map(),elapsed=new Map(),checked=new Set(),queue=[];
const groups=['SH','M'].flatMap(p=>Array.from({length:12},(_,i)=>p+String(i+1).padStart(2,'0')));
const fake=groups.flatMap(g=>Array.from({length:12},(_,i)=>({asset_id:'KL_'+g+'_'+String(i+1).padStart(3,'0'),label_vi:'Chưa tải metadata',label_status:'UNAVAILABLE',relative_path:'WEBP/'+g+'/KL-'+g+'-'+String(i+1).padStart(2,'0')+'.webp'})));
let assets=fake,valid=false,hidden=false,broken=false,page=0,size=12,token=0,active=0,stop=false,scanning=false,scanDone=0,scanMs=0,observer=null;
function registryOkay(j){if(!j||j.release_commit!==RELEASE||j.total!==288||j.assets.length!==288)return false;const ids=new Set(),paths=new Set();for(const a of j.assets){const m=/^KL_(SH|M)(\d{2})_(\d{3})$/.exec(a.asset_id),p=/^WEBP\/(SH|M)(\d{2})\/KL-(SH|M)(\d{2})-(\d{2})\.webp$/.exec(a.relative_path);if(!m||!p||m[1]!==p[1]||m[2]!==p[2]||m[1]!==p[3]||m[2]!==p[4]||Number(m[3])!==Number(p[5])||ids.has(a.asset_id)||paths.has(a.relative_path))return false;ids.add(a.asset_id);paths.add(a.relative_path)}return ids.size===288}
function fallback(node,text){node.textContent='🖼️ '+text}
function fetchOne(a){return new Promise(done=>{const t=performance.now(),img=new Image();let finished=false;const timer=setTimeout(()=>end('failed'),18000);function end(state){if(finished)return;finished=true;clearTimeout(timer);img.onload=null;img.onerror=null;done({state,ms:Math.round(performance.now()-t),image:state==='loaded'?img:null})}img.onload=()=>end('loaded');img.onerror=()=>end('failed');img.decoding='async';img.src=broken?'data:image/webp;base64,INVALID':ROOT+a.relative_path})}
function metric(){const r=[...elapsed.values()].sort((a,b)=>a-b);$('timeStats').textContent=r.length?'Thời gian tải: '+r.length+' ảnh · trung bình '+Math.round(r.reduce((a,b)=>a+b,0)/r.length)+' ms · P90 '+r[Math.floor(.9*r.length)]+' ms':'Chưa có dữ liệu thời gian tải';$('counter').textContent='Đã tải '+[...states.values()].filter(x=>x==='loaded').length+' · Lỗi '+[...states.values()].filter(x=>x==='failed').length+' · Đã kiểm '+checked.size}
function pump(){while(active<3&&queue.length){const t=queue.shift();if(t.token!==token)continue;active++;fetchOne(t.a).then(r=>{if(t.token!==token)return;states.set(t.a.asset_id,r.state);elapsed.set(t.a.asset_id,r.ms);if(t.node.isConnected){if(r.image)t.node.replaceChildren(r.image);else fallback(t.node,'Ảnh lỗi, dùng fallback')}metric()}).finally(()=>{active--;pump()})}}
function render(){token++;queue.length=0;if(observer)observer.disconnect();const q=$('search').value.toLocaleLowerCase('vi-VN').trim(),status=$('approval').value,g=$('group').value;const filtered=assets.filter(a=>(!q||a.asset_id.toLowerCase().includes(q)||a.label_vi.toLocaleLowerCase('vi-VN').includes(q))&&(!status||a.label_status===status)&&(!g||groupOf(a)===g));const pages=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,pages-1);$('pageCount').textContent=(page+1)+'/'+pages;$('prev').disabled=page===0;$('next').disabled=page===pages-1;const items=filtered.slice(page*size,(page+1)*size),root=$('grid');root.replaceChildren();const frag=document.createDocumentFragment(),lazy=new Map();for(const a of items){const c=document.createElement('article');c.className='card';const box=document.createElement('div');box.className='preview';box.textContent='Đang đợi vùng hiển thị…';const id=document.createElement('strong');id.textContent=a.asset_id;const lab=document.createElement('small');lab.textContent=a.label_vi;const statusText=document.createElement('small');statusText.textContent=a.label_status;const path=document.createElement('small');path.textContent=a.relative_path;const check=document.createElement('input');check.type='checkbox';check.checked=checked.has(a.asset_id);check.onchange=()=>{check.checked?checked.add(a.asset_id):checked.delete(a.asset_id);metric()};c.append(box,id,lab,statusText,path,check);frag.append(c);lazy.set(box,a)}root.append(frag);const generation=token;observer=new IntersectionObserver(entries=>{for(const entry of entries){if(!entry.isIntersecting)continue;observer.unobserve(entry.target);const a=lazy.get(entry.target);if(!valid)fallback(entry.target,'Metadata chưa tải');else if(hidden)fallback(entry.target,'Đã tắt tải ảnh');else{queue.push({a,node:entry.target,token:generation});pump()}}},{rootMargin:'120px'});for(const e of lazy.keys())observer.observe(e);metric()}
for(const g of groups){const el=document.createElement('option');el.value=g;el.textContent=g;$('group').append(el)}
$('search').oninput=()=>{page=0;render()};$('group').onchange=()=>{page=0;render()};$('approval').onchange=()=>{page=0;render()};$('pageSize').onchange=()=>{size=Number($('pageSize').value);page=0;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('hide').onclick=()=>{hidden=!hidden;render()};$('broken').onclick=()=>{broken=!broken;states.clear();elapsed.clear();render()};
$('scan').onclick=async()=>{if(!valid||scanning)return;stop=false;scanning=true;scanDone=0;const t=performance.now();$('scan').disabled=true;let idx=0;async function worker(){while(idx<assets.length&&!stop){const a=assets[idx++],r=await fetchOne(a);states.set(a.asset_id,r.state);elapsed.set(a.asset_id,r.ms);scanDone++;if(scanDone%6===0)metric()}}try{await Promise.all(Array.from({length:3},worker))}finally{scanMs=Math.round(performance.now()-t);scanning=false;$('scan').disabled=false;metric();render();$('timeStats').textContent+=' · quét '+scanDone+'/288 trong '+scanMs+' ms'}};
$('export').onclick=()=>{const metrics=[...elapsed.values()].sort((a,b)=>a-b),report={stage:'G7.4-B.5.7-PERF-A',registryVerified:valid,count:assets.length,loaded:[...states.values()].filter(x=>x==='loaded').length,failed:[...states.values()].filter(x=>x==='failed').length,unloaded:assets.length-states.size,scanDone,scanMs,avgMs:metrics.length?Math.round(metrics.reduce((a,b)=>a+b,0)/metrics.length):null,p90Ms:metrics.length?metrics[Math.floor(metrics.length*.9)]:null,checked:checked.size,assets:assets.map(a=>({assetId:a.asset_id,state:states.get(a.asset_id)||'unloaded',ms:elapsed.get(a.asset_id)||null}))};const u=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='G7_B57_PERF_A_QA.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};
render();fetch(REG,{cache:'force-cache'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(j=>{if(!registryOkay(j))throw Error('INVALID_REGISTRY');assets=j.assets;valid=true;$('info').textContent='Metadata 288/288 · 288 nhãn đã duyệt · chỉ tải ảnh vùng xem';render()}).catch(e=>$('info').textContent='Lỗi nạp registry: '+e.message);
})();
</script></body></html>
