<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thực Hành Toán Lớp 2 - Chân Trời Sáng Tạo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Quicksand', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background: linear-gradient(135deg, #E0F2FE 0%, #FEF3C7 50%, #DCFCE7 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.5);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #60A5FA;
            border-radius: 10px;
        }
        /* Game Buttons 3D Effect */
        .btn-3d {
            transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 0 rgba(0,0,0,0.18);
            transform: translateY(0);
        }
        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.18);
        }
        .numpad-btn {
            box-shadow: 0 5px 0 #CBD5E1;
            transition: all 0.1s;
        }
        .numpad-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #CBD5E1;
        }
        /* Active Input Box Animation */
        .input-slot {
            transition: all 0.2s;
            cursor: pointer;
        }
        .input-slot.active-slot {
            border-color: #F59E0B !important;
            background-color: #FEF3C7 !important;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.35);
            transform: scale(1.06);
        }
        .input-slot.correct-slot {
            border-color: #10B981 !important;
            background-color: #D1FAE5 !important;
            color: #065F46 !important;
        }
        .input-slot.wrong-slot {
            border-color: #EF4444 !important;
            background-color: #FEE2E2 !important;
            color: #991B1B !important;
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        @keyframes popBounce {
            0% { transform: scale(1); }
            40% { transform: scale(1.35) translateY(-8px); }
            70% { transform: scale(0.92); }
            100% { transform: scale(1); }
        }
        .animate-pop {
            animation: popBounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        /* Number Bond Connecting Lines */
        .bond-line {
            stroke: #64748B;
            stroke-width: 3.5;
            stroke-linecap: round;
        }
    </style>
</head>

    <script>
        /* =========================================================================
           1. AUDIO SYNTHESIZER (WEB AUDIO API) & VIETNAMESE TTS (WEB SPEECH API)
           ========================================================================= */
        let isMuted = false;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (isMuted) return;
            try {
                initAudio();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;

                if (type === 'click') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(680, now + 0.06);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.06);
                } else if (type === 'pop') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'success') {
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                    notes.forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.09);
                        gain.gain.setValueAtTime(0.22, now + idx * 0.09);
                        gain.gain.exponentialRampToValueAtTime(0.008, now + idx * 0.09 + 0.28);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.09);
                        osc.stop(now + idx * 0.09 + 0.28);
                    });
                } else if (type === 'error') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(150, now + 0.25);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.26);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.26);
                }
            } catch (e) {
                console.warn('Audio error:', e);
            }
        }

        function speakVietnamese(text) {
            if (isMuted) return;
            playSound('click');
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'vi-VN';
                utter.rate = 0.95;
                utter.pitch = 1.1;
                window.speechSynthesis.speak(utter);
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('muteBtn').innerText = isMuted ? '🔇' : '🔊';
            if (isMuted && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        /* =========================================================================

                tip: 'Đặc trưng sách Chân trời sáng tạo: Muốn cộng 8 + 5, ta tách 5 thành 2 và 3 để gộp 8 + 2 = 10, rồi lấy 10 + 3 = 13.'

                topicBadge: 'HK1 & HK2 • Cộng trừ có nhớ PV 100 & 1000',
                prompt: 'Thực hiện phép tính dọc từ hàng đơn vị sang hàng chục, hàng trăm. Đừng quên bấm vào ô Nhớ nhỏ màu vàng phía trên nhé!',

            },
            {

                shortTitle: '3. Nối cặp tương ứng',
                subtitle: 'DẠNG 3: NỐI CẶP TƯƠNG ỨNG (CHẠM 2 ĐIỂM HOẶC KÉO DÂY)',
                topicCode: 'hk2_4',

                prompt: 'Nối mỗi thẻ bên trái với thẻ tương ứng bên phải (Em có thể chạm 2 điểm hoặc giữ chuột/ngón tay kéo vẽ dây nối).',

                shortTitle: '4. Trắc nghiệm + Loa đọc',
                subtitle: 'DẠNG 4: TRẮC NGHIỆM LỰA CHỌN CÓ GIỌNG ĐỌC & THẺ TRỰC QUAN',
                topicCode: 'hk2_6',

                prompt: 'Bấm vào nút Loa 🔊 ở từng phương án để nghe đọc và chọn câu trả lời đúng cho cả 2 câu hỏi dưới đây!',
                tip: 'Mọi phương án chữ đều có hình minh họa trực quan và nút đọc tiếng Việt hỗ trợ các bé lớp 2 đọc chữ còn chậm.'
            },
            {
                id: 5,
                shortTitle: '5. Hình học & Tangram',
                subtitle: 'DẠNG 5: CHỌN HÌNH PHÁT SÁNG & XẾP HÌNH TANGRAM LỚP 2',
                topicCode: 'hk2_5',

        function renderInputSlot(slotId, placeholder = '?', widthClass = 'w-14 h-14', maxLen = 3) {
            const val = inputValues[slotId] !== undefined && inputValues[slotId] !== '' ? inputValues[slotId] : '';
            const isActive = activeInputId === slotId;
            return `
                <div id="slot_${slotId}"
                     onclick="selectInputSlot('${slotId}', ${maxLen})"
                     data-maxlen="${maxLen}"
                     class="input-slot inline-flex items-center justify-center ${widthClass} rounded-2xl border-4 font-extrabold text-xl md:text-2xl shadow-inner
                     ${isActive ? 'active-slot' : 'border-sky-400 bg-white text-indigo-900'}">
                    ${val !== '' ? val : `<span class="text-slate-300 text-lg">${placeholder}</span>`}
                </div>
            `;
        }

        function selectInputSlot(slotId, maxLen = 3) {
            playSound('click');
            activeInputId = slotId;
            if (isNumpadMinimized) toggleNumpadMinimize();

            document.querySelectorAll('.input-slot').forEach(el => {
                el.classList.remove('active-slot', 'correct-slot', 'wrong-slot');
            });
            const targetEl = document.getElementById(`slot_${slotId}`);
            if (targetEl) {
                targetEl.classList.add('active-slot');
                targetEl.dataset.maxlen = maxLen;
            }
        }

        function handleNumpadPress(char) {
            playSound('pop');
            if (!activeInputId) {
                // Auto-focus first available input slot on page
                const firstSlot = document.querySelector('.input-slot');
                if (firstSlot) {
                    const id = firstSlot.id.replace('slot_', '');
                    selectInputSlot(id, parseInt(firstSlot.dataset.maxlen || '3', 10));
                } else {
                    return;
                }
            }

            const slotEl = document.getElementById(`slot_${activeInputId}`);
            const maxLen = slotEl ? parseInt(slotEl.dataset.maxlen || '3', 10) : 3;
            const currentVal = inputValues[activeInputId] || '';

            // Operator slot handling
            if (['+', '-', '×', ':'].includes(char)) {
                inputValues[activeInputId] = char;
            } else {
                if (['+', '-', '×', ':'].includes(currentVal) || maxLen === 1) {
                    inputValues[activeInputId] = char;
                } else if (currentVal.length < maxLen) {
                    inputValues[activeInputId] = currentVal + char;
                } else {
                    inputValues[activeInputId] = char;
                }
            }

            updateSlotDOM(activeInputId);

            // Special Auto-Advance right-to-left for Type 2 (Vertical Calculation)
            if (EXERCISE_TYPES[currentTypeIndex].id === 2 && maxLen === 1) {
                const idx = t2Sequence.indexOf(activeInputId);
                if (idx !== -1 && idx + 1 < t2Sequence.length) {
                    setTimeout(() => selectInputSlot(t2Sequence[idx + 1], 1), 120);
                }
            }
        }

        function handleNumpadBackspace() {
            playSound('click');
            if (!activeInputId) return;
            const currentVal = inputValues[activeInputId] || '';
            inputValues[activeInputId] = currentVal.slice(0, -1);
            updateSlotDOM(activeInputId);
        }

        function updateSlotDOM(slotId) {
            const el = document.getElementById(`slot_${slotId}`);
            if (!el) return;
            const val = inputValues[slotId] || '';
            el.innerHTML = val !== '' ? val : `<span class="text-slate-300 text-lg">?</span>`;
        }

        function renderType3_Matching(stage) {
            const matchedCount = Object.keys(t3MatchedPairs).length;

                    <div id="matchingBoard" class="relative w-full grid grid-cols-2 gap-12 md:gap-24 py-2 select-none">

                                return `
                                    <div id="match_${item.id}"

                                const isMatched = Object.values(t3MatchedPairs).includes(item.id);

                                         data-rightid="${item.id}"
                                         onclick="handleRightCardTap('${item.id}')"

                                            ? 'bg-emerald-100 border-emerald-500 text-emerald-900'
                                            : 'bg-white hover:bg-amber-50 border-indigo-300'}">
                                        <div id="anchor_${item.id}" class="w-5 h-5 rounded-full ${isMatched ? 'bg-emerald-500' : 'bg-indigo-400'} border-2 border-white shadow"></div>
                                        <div class="text-right">
                                            <div class="text-base md:text-lg font-extrabold">${item.text}</div>

        function handleLeftCardTap(leftId) {
            if (t3MatchedPairs[leftId]) return;
            playSound('click');
            t3SelectedLeft = leftId;
            renderType3_Matching(document.getElementById('interactiveStage'));
        }

        function handleRightCardTap(rightId) {
            if (!t3SelectedLeft) return;
            verifyMatchAttempt(t3SelectedLeft, rightId);
        }

        function startMatchDrag(e, leftId) {
            if (t3MatchedPairs[leftId]) return;
            t3SelectedLeft = leftId;
            const board = document.getElementById('matchingBoard');
            if (!board) return;
            const rect = board.getBoundingClientRect();
            const anchorEl = document.getElementById(`anchor_${leftId}`);
            const aRect = anchorEl.getBoundingClientRect();

            t3TempDrag = {
                leftId,
                startX: aRect.left + aRect.width / 2 - rect.left,
                startY: aRect.top + aRect.height / 2 - rect.top,
                currX: e.clientX - rect.left,
                currY: e.clientY - rect.top
            };

            const moveHandler = (moveEvt) => {
                if (!t3TempDrag) return;
                t3TempDrag.currX = moveEvt.clientX - rect.left;
                t3TempDrag.currY = moveEvt.clientY - rect.top;
                drawMatchingLines();
            };

            const upHandler = (upEvt) => {
                window.removeEventListener('pointermove', moveHandler);
                window.removeEventListener('pointerup', upHandler);
                if (!t3TempDrag) return;

                const targetEl = document.elementFromPoint(upEvt.clientX, upEvt.clientY);
                const rightCard = targetEl ? targetEl.closest('[data-rightid]') : null;
                const draggedLeft = t3TempDrag.leftId;
                t3TempDrag = null;

                if (rightCard) {
                    verifyMatchAttempt(draggedLeft, rightCard.dataset.rightid);
                } else {
                    renderType3_Matching(document.getElementById('interactiveStage'));
                }
            };

            window.addEventListener('pointermove', moveHandler);
            window.addEventListener('pointerup', upHandler);
        }

        function verifyMatchAttempt(leftId, rightId) {
            const leftObj = t3LeftItems.find(i => i.id === leftId);
            if (!leftObj) return;

            if (leftObj.matchId === rightId) {
                playSound('success');
                t3MatchedPairs[leftId] = rightId;
                t3SelectedLeft = null;
                renderType3_Matching(document.getElementById('interactiveStage'));
                if (Object.keys(t3MatchedPairs).length === t3LeftItems.length) {
                    showFeedback(true, 'Tuyệt vời! Em đã nối đúng tất cả 4 cặp tương ứng!');
                }
            } else {
                playSound('error');
                t3WrongPair = { leftId, rightId };
                t3SelectedLeft = null;
                drawMatchingLines();
                setTimeout(() => {
                    t3WrongPair = null;
                    renderType3_Matching(document.getElementById('interactiveStage'));
                }, 500);
            }
        }

        function drawMatchingLines() {
            const svg = document.getElementById('matchingSvg');
            const board = document.getElementById('matchingBoard');
            if (!svg || !board) return;
            const boardRect = board.getBoundingClientRect();

            let pathsHtml = '';

            // Draw confirmed green matches
            Object.entries(t3MatchedPairs).forEach(([lId, rId]) => {
                const lAnchor = document.getElementById(`anchor_${lId}`);
                const rAnchor = document.getElementById(`anchor_${rId}`);
                if (lAnchor && rAnchor) {
                    const lRect = lAnchor.getBoundingClientRect();
                    const rRect = rAnchor.getBoundingClientRect();
                    const x1 = lRect.left + lRect.width / 2 - boardRect.left;
                    const y1 = lRect.top + lRect.height / 2 - boardRect.top;
                    const x2 = rRect.left + rRect.width / 2 - boardRect.left;
                    const y2 = rRect.top + rRect.height / 2 - boardRect.top;
                    pathsHtml += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#10B981" stroke-width="5" stroke-linecap="round" />`;
                }
            });

            // Draw temporary dragging line
            if (t3TempDrag) {
                pathsHtml += `<line x1="${t3TempDrag.startX}" y1="${t3TempDrag.startY}" x2="${t3TempDrag.currX}" y2="${t3TempDrag.currY}" stroke="#F59E0B" stroke-width="5" stroke-dasharray="8 6" stroke-linecap="round" />`;
            }

            // Draw wrong pair red flash line
            if (t3WrongPair) {
                const lAnchor = document.getElementById(`anchor_${t3WrongPair.leftId}`);
                const rAnchor = document.getElementById(`anchor_${t3WrongPair.rightId}`);
                if (lAnchor && rAnchor) {
                    const lRect = lAnchor.getBoundingClientRect();
                    const rRect = rAnchor.getBoundingClientRect();
                    const x1 = lRect.left + lRect.width / 2 - boardRect.left;
                    const y1 = lRect.top + lRect.height / 2 - boardRect.top;
                    const x2 = rRect.left + rRect.width / 2 - boardRect.left;
                    const y2 = rRect.top + rRect.height / 2 - boardRect.top;
                    pathsHtml += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#EF4444" stroke-width="6" stroke-linecap="round" />`;
                }
            }

            svg.innerHTML = pathsHtml;
        }

            renderType6_DragDropOrdering(document.getElementById('interactiveStage'));

        function renderT8Ruler() {
            // Segment AB starts at x = 60, length = 7 cm * 32px/cm = 224px (ends at x = 284)
            const isAligned = Math.abs(t8RulerX - 60) <= 10;
            let ticksSvg = '';
            for (let cm = 0; cm <= 10; cm++) {
                const tx = 16 + cm * 32;
                ticksSvg += `
                    <line x1="${tx}" y1="0" x2="${tx}" y2="18" stroke="#1E293B" stroke-width="2.5"/>
                    <text x="${tx}" y="34" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E293B">${cm}</text>
                `;
                if (cm < 10) {
                    const halfX = tx + 16;
                    ticksSvg += `<line x1="${halfX}" y1="0" x2="${halfX}" y2="10" stroke="#64748B" stroke-width="1.5"/>`;
                }
            }

            return `
                <div class="bg-sky-50 border-2 border-sky-300 rounded-3xl p-4 flex flex-col items-center">
                    <div class="flex flex-wrap items-center justify-between w-full gap-2 mb-2">

                            ${isAligned
                                ? '✅ Vạch số 0 đã trùng khít điểm A! Hãy nhìn điểm B ứng với vạch số mấy nhé!'
                                : '⚠️ Hãy kéo thước sang trái hoặc bấm nút "Căn chuẩn vạch 0" để vạch số 0 trùng điểm A!'}

                        <button onclick="alignRulerToZero()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold px-3 py-1.5 rounded-xl btn-3d">
                            🎯 Căn chuẩn vạch số 0 trùng điểm A
                        </button>
                    </div>

                    <!-- Interactive SVG Ruler Canvas -->
                    <svg id="rulerSvg" viewBox="0 0 420 155" class="w-full max-w-xl h-40 bg-white rounded-2xl border-2 border-sky-200 touch-none select-none"
                         onpointermove="moveRulerDrag(event)" onpointerup="endRulerDrag()">
                        <!-- Vertical alignment helper line at A (x=60) -->
                        <line x1="60" y1="20" x2="60" y2="140" stroke="${isAligned ? '#10B981' : '#F59E0B'}" stroke-width="2" stroke-dasharray="4 4"/>

                        <!-- Line Segment AB (7 cm = 224px) -->
                        <line x1="60" y1="50" x2="284" y2="50" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>
                        <circle cx="60" cy="50" r="6" fill="#1D4ED8"/>
                        <circle cx="284" cy="50" r="6" fill="#1D4ED8"/>
                        <text x="60" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A8A">A</text>
                        <text x="284" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E3A8A">B</text>

                        <!-- Draggable Virtual Ruler (0 mark is at local x=16, so translate by t8RulerX - 16) -->
                        <g transform="translate(${t8RulerX - 16}, 70)"
                           onpointerdown="startRulerDrag(event)"
                           class="cursor-grab active:cursor-grabbing">
                            <rect x="0" y="0" width="352" height="52" rx="8" fill="#FDE047" stroke="#CA8A04" stroke-width="3"/>
                            ${ticksSvg}
                            <text x="176" y="47" text-anchor="middle" font-size="10" font-weight="bold" fill="#854D0E">↔ KÉO THƯỚC KẺ (ĐƠN VỊ: CM) ↔</text>
                        </g>
                    </svg>

                    <div class="mt-4 flex items-center gap-3 text-lg md:text-xl font-extrabold">
                        <span>Đoạn thẳng AB dài:</span>
                        ${renderInputSlot('t8_len', '?', 'w-16 h-14', 2)}
                        <span>cm</span>
                    </div>
                </div>
            `;
        }

        function startRulerDrag(e) {
            t8IsDraggingRuler = true;
            const svg = document.getElementById('rulerSvg');
            const pt = svg.createSVGPoint();
            pt.x = e.clientX;
            pt.y = e.clientY;
            const cursorPt = pt.matrixTransform(svg.getScreenCTM().inverse());
            t8DragOffsetX = cursorPt.x - t8RulerX;
        }

        function moveRulerDrag(e) {
            if (!t8IsDraggingRuler) return;
            const svg = document.getElementById('rulerSvg');
            if (!svg) return;
            const pt = svg.createSVGPoint();
            pt.x = e.clientX;
            pt.y = e.clientY;
            const cursorPt = pt.matrixTransform(svg.getScreenCTM().inverse());
            let newX = cursorPt.x - t8DragOffsetX;
            if (Math.abs(newX - 60) < 12) newX = 60; // Magnetic snap to Point A
            t8RulerX = Math.max(25, Math.min(180, newX));
            renderType8_RulerAndClock(document.getElementById('interactiveStage'));
        }

        function endRulerDrag() {
            t8IsDraggingRuler = false;
        }

        function alignRulerToZero() {
            playSound('pop');
            t8RulerX = 60;
            renderType8_RulerAndClock(document.getElementById('interactiveStage'));
        }

        function renderT8Clock() {
            const minAngle = t8ClockMinute * 6; // 0, 90, 180, 270
            const hourAngle = (t8ClockHour % 12) * 30 + (t8ClockMinute / 60) * 30;

            let numbersSvg = '';
            for (let n = 1; n <= 12; n++) {
                const rad = ((n * 30 - 90) * Math.PI) / 180;
                const nx = 110 + 76 * Math.cos(rad);
                const ny = 110 + 76 * Math.sin(rad) + 6;
                numbersSvg += `<text x="${nx}" y="${ny}" text-anchor="middle" font-size="16" font-weight="bold" fill="#1E293B">${n}</text>`;
            }

            return `
                <div class="bg-amber-50 border-2 border-amber-300 rounded-3xl p-4 flex flex-col md:flex-row items-center justify-around gap-6">
                    <!-- Clock SVG -->
                    <div class="flex flex-col items-center">
                        <svg viewBox="0 0 220 220" class="w-52 h-52 drop-shadow-md">
                            <circle cx="110" cy="110" r="100" fill="#FFFFFF" stroke="#F59E0B" stroke-width="8"/>
                            ${numbersSvg}
                            <!-- Hour Hand (Short, Red) -->
                            <line x1="110" y1="110"
                                  x2="${110 + 48 * Math.cos(((hourAngle - 90) * Math.PI) / 180)}"
                                  y2="${110 + 48 * Math.sin(((hourAngle - 90) * Math.PI) / 180)}"
                                  stroke="#EF4444" stroke-width="7" stroke-linecap="round"/>
                            <!-- Minute Hand (Long, Blue) -->
                            <line x1="110" y1="110"
                                  x2="${110 + 68 * Math.cos(((minAngle - 90) * Math.PI) / 180)}"
                                  y2="${110 + 68 * Math.sin(((minAngle - 90) * Math.PI) / 180)}"
                                  stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
                            <circle cx="110" cy="110" r="7" fill="#1E293B"/>
                        </svg>
                    </div>

                    <!-- Interactive Controls -->
                    <div class="space-y-3 text-center md:text-left">
                        <div class="bg-white p-3 rounded-2xl border-2 border-amber-200">
                            <div class="text-xs font-extrabold text-slate-400 uppercase">Yêu cầu đề bài:</div>
                            <div class="text-xl font-extrabold text-indigo-900">Xoay kim đến 7 giờ 15 phút</div>
                            <div class="text-sm font-bold text-emerald-700 mt-1">
                                Đồng hồ đang chỉ: ${t8ClockHour} giờ ${t8ClockMinute === 0 ? 'đúng (00 phút)' : t8ClockMinute + ' phút'}
                            </div>
                        </div>

                        <div class="flex flex-wrap gap-2 justify-center md:justify-start">
                            <button onclick="adjustClock(0, 15)" class="btn-3d bg-sky-500 hover:bg-sky-600 text-white font-extrabold px-4 py-2.5 rounded-2xl text-sm">
                                🔵 Xoay kim phút (+15 phút)
                            </button>
                            <button onclick="adjustClock(1, 0)" class="btn-3d bg-rose-500 hover:bg-rose-600 text-white font-extrabold px-4 py-2.5 rounded-2xl text-sm">
                                🔴 Xoay kim giờ (+1 giờ)
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function adjustClock(addHour, addMin) {
            playSound('pop');
            t8ClockMinute = (t8ClockMinute + addMin) % 60;
            t8ClockHour = ((t8ClockHour - 1 + addHour) % 12) + 1;
            renderType8_RulerAndClock(document.getElementById('interactiveStage'));
        }

        /* -------------------------------------------------------------------------
           TYPE 9: PICTOGRAPH READING - TAP TO COUNT (CHẠM ĐỂ ĐẾM)
           ------------------------------------------------------------------------- */
        function renderType9_Pictograph(stage) {
            const rows = [
                { key: 'apple', name: 'Táo đỏ', emoji: '🍎', items: t9Counted.apple },
                { key: 'mango', name: 'Xoài chín', emoji: '🥭', items: t9Counted.mango },
                { key: 'orange', name: 'Cam vàng', emoji: '🍊', items: t9Counted.orange }
            ];

            stage.innerHTML = `
                <div class="w-full space-y-4">
                    <div class="bg-emerald-50 border-2 border-emerald-300 rounded-3xl p-4">
                        <div class="flex items-center justify-between mb-3">
                            <span class="font-extrabold text-emerald-900 text-sm md:text-base">
                                👆 Em hãy chạm vào từng quả để đếm to thành tiếng (1, 2, 3...):
                            </span>
                            <button onclick="countAllPictographRow('apple')" class="text-xs font-extrabold bg-emerald-200 text-emerald-900 px-3 py-1 rounded-xl">
                                ✨ Đếm mẫu hàng Táo
                            </button>
                        </div>

                        <div class="space-y-3">
                            ${rows.map(row => {
                                const countedTotal = row.items.filter(Boolean).length;
                                return `
                                    <div class="bg-white rounded-2xl p-3 border-2 border-emerald-200 flex flex-wrap items-center justify-between gap-2">
                                        <div class="w-28 font-extrabold text-slate-800 text-base flex items-center gap-1.5">
                                            <span>${row.emoji}</span>
                                            <span>${row.name}</span>
                                        </div>

                                        <div class="flex-1 flex flex-wrap items-center gap-2">
                                            ${row.items.map((isCounted, idx) => `
                                                <button onclick="tapPictographItem('${row.key}', ${idx})"
                                                        id="picto_${row.key}_${idx}"
                                                        class="relative w-12 h-12 rounded-2xl border-2 flex items-center justify-center text-2xl transition-all
                                                        ${isCounted
                                                            ? 'bg-amber-100 border-amber-500 scale-105 shadow-sm'
                                                            : 'bg-slate-50 hover:bg-sky-50 border-slate-200'}">
                                                    <span>${row.emoji}</span>
                                                    ${isCounted ? `
                                                        <span class="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-indigo-600 text-white font-extrabold text-xs flex items-center justify-center shadow">
                                                            ${idx + 1}
                                                        </span>
                                                    ` : ''}
                                                </button>
                                            `).join('')}
                                        </div>

                                        <div class="w-20 text-right font-extrabold text-sm text-indigo-700">
                                            Đã đếm: ${countedTotal}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Questions below Pictograph -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-white p-4 rounded-2xl border-2 border-sky-300 flex items-center justify-between">
                            <span class="font-extrabold text-slate-800 text-base">1. Có tất cả bao nhiêu quả Táo đỏ 🍎?</span>
                            ${renderInputSlot('t9_apple', '?', 'w-16 h-14', 2)}
                        </div>
                        <div class="bg-white p-4 rounded-2xl border-2 border-sky-300 flex items-center justify-between">
                            <span class="font-extrabold text-slate-800 text-base">2. Số quả Cam 🍊 nhiều hơn Xoài 🥭 mấy quả?</span>
                            ${renderInputSlot('t9_diff', '?', 'w-16 h-14', 2)}
                        </div>
                    </div>
                </div>
            `;
            setTimeout(() => selectInputSlot('t9_apple', 2), 60);
        }

        function tapPictographItem(rowKey, idx) {
            t9Counted[rowKey][idx] = true;
            const countNum = idx + 1;
            speakVietnamese(String(countNum));
            renderType9_Pictograph(document.getElementById('interactiveStage'));
            const btn = document.getElementById(`picto_${rowKey}_${idx}`);
            if (btn) btn.classList.add('animate-pop');
        }

        function countAllPictographRow(rowKey) {
            t9Counted[rowKey] = t9Counted[rowKey].map(() => true);
            speakVietnamese('Một, hai, ba, bốn, năm, sáu! Có sáu quả táo đỏ!');
            renderType9_Pictograph(document.getElementById('interactiveStage'));
        }

        /* -------------------------------------------------------------------------
           TYPE 10: 3-STEP SCAFFOLDED WORD PROBLEM (GIẢI TOÁN CÓ LỜI VĂN 3 BƯỚC)
           ------------------------------------------------------------------------- */
        function renderType10_WordProblem(stage) {
            const statements = [
                { id: 'st1', text: 'Số ki-lô-gam bao gạo nếp cân nặng là:' },
                { id: 'st2', text: 'Số ki-lô-gam cả hai bao gạo cân nặng là:' },
                { id: 'st3', text: 'Số ki-lô-gam bao gạo tẻ nặng hơn là:' }
            ];

            stage.innerHTML = `
                <div class="w-full space-y-4">
                    <!-- Step 1: Select Solution Statement -->
                    <div class="bg-sky-50 border-2 border-sky-300 rounded-3xl p-4">
                        <div class="text-sm font-extrabold text-sky-900 mb-2">
                            🔹 Bước 1: Em hãy chọn câu lời giải đúng (không cần gõ chữ dài):
                        </div>
                        <div class="space-y-2">
                            ${statements.map(st => {
                                const selected = t10SelectedStatement === st.id;
                                return `
                                    <div onclick="selectT10Statement('${st.id}')"
                                         class="p-3 rounded-2xl border-3 cursor-pointer flex items-center justify-between transition-all
                                         ${selected ? 'bg-indigo-600 text-white border-indigo-800 font-extrabold shadow' : 'bg-white hover:bg-sky-100 text-slate-800 border-sky-200 font-bold'}">
                                        <span>${st.text}</span>
                                        <button onclick="event.stopPropagation(); speakVietnamese('${st.text}')"
                                                class="w-8 h-8 rounded-lg ${selected ? 'bg-indigo-500 text-white' : 'bg-slate-100 text-slate-700'}">
                                            🔊
                                        </button>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Step 2: Equation Builder -->
                    <div class="bg-amber-50 border-2 border-amber-300 rounded-3xl p-4 flex flex-wrap items-center justify-between gap-3">
                        <div class="text-sm font-extrabold text-amber-900">
                            🔹 Bước 2: Điền số và dấu phép tính (+, −):
                        </div>
                        <div class="flex items-center gap-2 flex-wrap">
                            ${renderInputSlot('t10_n1', '36', 'w-16 h-14', 2)}
                            ${renderInputSlot('t10_op', '−', 'w-14 h-14', 1)}
                            ${renderInputSlot('t10_n2', '12', 'w-16 h-14', 2)}
                            <span class="text-2xl font-extrabold">=</span>
                            ${renderInputSlot('t10_res', '?', 'w-16 h-14', 2)}
                            <span class="text-lg font-extrabold text-slate-700">(kg)</span>
                        </div>
                    </div>

                    <!-- Step 3: Final Answer -->
                    <div class="bg-emerald-50 border-2 border-emerald-300 rounded-3xl p-4 flex items-center justify-between">
                        <div class="text-sm md:text-base font-extrabold text-emerald-900">
                            🔹 Bước 3: Điền Đáp số hoàn chỉnh:
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="font-extrabold text-lg">Đáp số:</span>
                            ${renderInputSlot('t10_final', '?', 'w-20 h-14', 2)}
                            <span class="font-extrabold text-lg">kg</span>
                        </div>
                    </div>
                </div>
            `;
            setTimeout(() => selectInputSlot('t10_n1', 2), 60);
        }

        function selectT10Statement(stId) {
            playSound('pop');
            t10SelectedStatement = stId;
            renderType10_WordProblem(document.getElementById('interactiveStage'));
        }

        /* =========================================================================
           7. VALIDATION & FEEDBACK ENGINE FOR ALL 10 TYPES
           ========================================================================= */
        function checkCurrentExercise() {
            const exId = EXERCISE_TYPES[currentTypeIndex].id;
            let isCorrect = false;
            let msg = '';

            if (exId === 1) {
                const checks = [
                    { id: 't1_split1', ans: '2' },
                    { id: 't1_split2', ans: '3' },
                    { id: 't1_ten', ans: '10' },
                    { id: 't1_ans', ans: '13' },
                    { id: 't1_dm', ans: '10' },
                    { id: 't1_m', ans: '100' }
                ];
                isCorrect = validateSlotList(checks);
                msg = isCorrect
                    ? 'Xuất sắc! Em đã nắm vững kỹ thuật tách 5 thành 2 và 3 để gộp đủ chục (8 + 2 = 10) và thuộc bảng đơn vị đo!'
                    : 'Có ô chưa chính xác. Gợi ý: 5 tách thành 2 và 3; 1 dm = 10 cm; 1 m = 100 cm.';
            } else if (exId === 2) {
                const checks = [
                    { id: 't2_q1_u', ans: '2' },
                    { id: 't2_q1_t', ans: '7' },
                    { id: 't2_q2_u', ans: '4' },
                    { id: 't2_q2_t', ans: '8' },
                    { id: 't2_q2_h', ans: '4' }
                ];
                isCorrect = validateSlotList(checks);
                msg = isCorrect
                    ? 'Giỏi lắm! 47 + 25 = 72 và 356 + 128 = 484. Em đặt tính từ phải sang trái rất chuẩn!'
                    : 'Em kiểm tra lại các chữ số màu đỏ nhé (Lưu ý: 7 + 5 = 12 viết 2 nhớ 1; 6 + 8 = 14 viết 4 nhớ 1).';
            } else if (exId === 3) {
                isCorrect = Object.keys(t3MatchedPairs).length === 4;
                msg = isCorrect
                    ? 'Hoàn hảo! Em đã nối đúng cả 4 cặp phép nhân và khối hình học!'
                    : 'Em hãy nối hết cả 4 cặp thẻ ở hai cột nhé!';
            } else if (exId === 4) {
                isCorrect = t4Answers.q1 === 'khong_the' && t4Answers.q2 === '1000d';
                msg = isCorrect
                    ? 'Chính xác! Hộp toàn bóng đỏ nên KHÔNG THỂ lấy được bóng xanh, và em đã chọn đúng tờ 1000 đồng!'
                    : 'Em hãy kiểm tra lại nhé: Trong hộp chỉ có bóng đỏ thì có lấy được bóng xanh không?';
            } else if (exId === 5) {
                if (t5SubMode === 'quad') {
                    isCorrect = t5SelectedShapes.size === 3 &&
                                t5SelectedShapes.has('s1') &&
                                t5SelectedShapes.has('s3') &&
                                t5SelectedShapes.has('s6');
                    msg = isCorrect
                        ? 'Tuyệt vời! Em đã tìm đúng cả 3 hình tứ giác (Hình 1, Hình 3 và Hình 6)!'
                        : 'Em lưu ý: Hình tứ giác là hình có đúng 4 cạnh và 4 đỉnh (Hình 1, 3, 6).';
                } else {
                    isCorrect = t5TangramPieces.every(p => p.placed);
                    msg = isCorrect
                        ? 'Khéo tay quá! Em đã ghép hoàn chỉnh ngôi nhà và cái cây bằng bộ Tangram!'
                        : 'Em hãy chọn từng mảnh ghép và bấm "Đặt vào khung mẫu" cho đủ 3 mảnh nhé!';
                }
            } else if (exId === 6) {
                const orderOk = t6OrderSlots[0] === 289 && t6OrderSlots[1] === 450 && t6OrderSlots[2] === 615 && t6OrderSlots[3] === 804;
                const basketOk = t6BasketItems.every(item =>
                    (item.val < 50 && item.basket === 'lt50') || (item.val > 50 && item.basket === 'gt50')
                );
                isCorrect = orderOk && basketOk;
                msg = isCorrect
                    ? 'Chính xác 100%! Thứ tự từ bé đến lớn là 289 < 450 < 615 < 804 và các giỏ đều đúng!'
                    : 'Em kiểm tra lại thứ tự từ bé đến lớn (289 < 450 < 615 < 804) và phân loại hết 4 phép tính vào 2 giỏ nhé!';
            } else if (exId === 7) {
                isCorrect = t7Choices.c1 === '=' && t7Choices.c2 === '>' && t7Choices.c3 === '<';
                msg = isCorrect
                    ? 'Đúng rồi! 2×5 = 15−5 (cùng bằng 10); 1m > 90cm (vì 100cm > 90cm); 15l + 20l < 40l!'
                    : 'Em nhớ quy tắc cá sấu há miệng về bên lớn hơn nhé: Câu 1 (=), Câu 2 (>), Câu 3 (<).';
            } else if (exId === 8) {
                if (t8SubMode === 'ruler') {
                    const rulerAligned = Math.abs(t8RulerX - 60) <= 10;
                    const lenOk = validateSlotList([{ id: 't8_len', ans: '7' }]);
                    isCorrect = rulerAligned && lenOk;
                    msg = isCorrect
                        ? 'Chuẩn xác! Em đã đặt vạch 0 trùng điểm A và đo được đoạn thẳng AB dài 7 cm!'
                        : 'Nhớ kéo thước để vạch số 0 trùng khít điểm A, rồi điền độ dài 7 cm nhé!';
                } else {
                    isCorrect = t8ClockHour === 7 && t8ClockMinute === 15;
                    msg = isCorrect
                        ? 'Giỏi quá! Đồng hồ đã chỉ đúng 7 giờ 15 phút!'
                        : 'Em hãy bấm nút xoay kim giờ đến số 7 và kim phút đến 15 phút (số 3) nhé!';
                }
            } else if (exId === 9) {
                const checks = [
                    { id: 't9_apple', ans: '6' },
                    { id: 't9_diff', ans: '3' }
                ];
                isCorrect = validateSlotList(checks);
                msg = isCorrect
                    ? 'Tuyệt vời! Có 6 quả táo đỏ, và 7 quả cam nhiều hơn 4 quả xoài là 3 quả (7 − 4 = 3)!'
                    : 'Em hãy chạm đếm lại trên biểu đồ nhé: Có 6 quả táo; Cam (7) nhiều hơn Xoài (4) là 3 quả.';
            } else if (exId === 10) {
                const stOk = t10SelectedStatement === 'st1';
                const checks = [
                    { id: 't10_n1', ans: '36' },
                    { id: 't10_op', ans: '-' },
                    { id: 't10_n2', ans: '12' },
                    { id: 't10_res', ans: '24' },
                    { id: 't10_final', ans: '24' }
                ];
                const mathOk = validateSlotList(checks);
                isCorrect = stOk && mathOk;
                msg = isCorrect
                    ? 'Hoàn thành xuất sắc bài toán có lời văn! 36 − 12 = 24 (kg)!'
                    : 'Em nhớ chọn lời giải "Số ki-lô-gam bao gạo nếp cân nặng là:" và phép tính 36 − 12 = 24 nhé!';
            }

            showFeedback(isCorrect, msg);
        }

        function validateSlotList(checks) {
            let allOk = true;
            checks.forEach(item => {
                const rawVal = (inputValues[item.id] || '').trim().replace('−', '-');
                const targetVal = item.ans.replace('−', '-');
                const el = document.getElementById(`slot_${item.id}`);
                if (rawVal === targetVal) {
                    if (el) {
                        el.classList.remove('wrong-slot', 'active-slot');
                        el.classList.add('correct-slot');
                    }
                } else {
                    allOk = false;
                    if (el) {
                        el.classList.remove('correct-slot', 'active-slot');
                        el.classList.add('wrong-slot');
                    }
                }
            });
            return allOk;
        }

        function showFeedback(isSuccess, message) {
            const banner = document.getElementById('feedbackBanner');
            const icon = document.getElementById('feedbackIcon');
            const text = document.getElementById('feedbackText');

            banner.classList.remove('hidden', 'bg-emerald-100', 'border-emerald-400', 'text-emerald-900', 'bg-rose-100', 'border-rose-400', 'text-rose-900');

            if (isSuccess) {
                playSound('success');
                starCount += 1;
                document.getElementById('starScore').innerText = starCount;
                banner.classList.add('bg-emerald-100', 'border-emerald-400', 'text-emerald-900');
                icon.innerText = '🎉';
            } else {
                playSound('error');
                banner.classList.add('bg-rose-100', 'border-rose-400', 'text-rose-900');
                icon.innerText = '💪';
            }

            text.innerText = message;
            speakVietnamese(message);
        }
    </script>
</body>
</html>
