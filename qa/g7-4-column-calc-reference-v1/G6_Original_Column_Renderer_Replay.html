function taoHienThiCauToan({E,input,baseCard}){
function vertical(q){
 if(!q.valid)return invalid(q);
 const a=String(q.n1).padStart(2,'0'),b=String(q.n2).padStart(2,'0');
 const answer=String(q.answer).padStart(2,'0');
 const inside='<div class="ml-vert-note">ĐV → Nhớ → Chục</div><div class="ml-vertical-matrix">'+
 '<div class="ml-vert-row"><span></span><small>CHỤC</small><small>ĐV</small></div>'+
 '<div class="ml-vert-row"><span class="ml-remember-label">nhớ</span>'+input(q,q.id+':carry',1,'data-ml-carry="1"')+'<span></span></div>'+
 '<div class="ml-vert-row numbers"><span></span><b>'+E(a[0])+'</b><b>'+E(a[1])+'</b></div>'+
 '<div class="ml-vert-row numbers rule"><span class="operator">+</span><b>'+E(b[0])+'</b><b>'+E(b[1])+'</b></div>'+
 '<div class="ml-vert-row answers"><span></span>'+input(q,q.id+':tens',1)+input(q,q.id+':ones',1)+'</div></div>';
 return baseCard(q,inside,'ml-vertical-card ml-vertical-paper');
}
function mental(q){
 const row='ml-mental-row',first='ml-mental-first';
 // Sử dụng grid năm cột có sẵn của test-theo-main; không đưa câu dài vào ô số.
 if(q.variantType==='carry'){

 }
 if(q.variantType==='reverse'){
   return '<div class="'+row+'" data-ml-q-card="'+E(q.id)+'">'+input(q,q.id+':answer',3)+'<b>+</b><span>'+E(q.n2)+'</span><b>=</b><span>'+E(Number(q.n1)+Number(q.n2))+'</span></div>';
 }
 if(q.variantType==='three'){
   return '<div class="'+row+'" data-ml-q-card="'+E(q.id)+'"><span class="'+first+'">'+E(q.n1+'+'+q.n2)+'</span><b>+</b><span>'+E(q.n3)+'</span><b>=</b>'+input(q,q.id+':answer',3)+'</div>';
 }
 if(q.pilotPrompt)return '<div class="'+row+'" data-ml-q-card="'+E(q.id)+'"><span class="'+first+'">'+E(q.pilotPrompt)+'</span>'+input(q,q.id+':answer',3)+(q.unit?' <span>'+E(q.unit)+'</span>':'')+'</div>';
 return '<div class="'+row+'" data-ml-q-card="'+E(q.id)+'"><span class="'+first+'">'+E(q.n1)+'</span><b>+</b><span>'+E(q.n2)+'</span><b>=</b>'+input(q,q.id+':answer',3)+'</div>';
}
function puzzle(q){
 if(!q.valid)return invalid(q);
 const inside='<div class="ml-puzzle">'+q.puzzle.map((row,ri)=>'<div class="ml-vert-row '+(ri===1?'rule ':'')+'numbers"><span class="operator">'+(ri===1?'+':'')+'</span>'+row.map((v,ci)=>v&&typeof v==='object'?input(q,q.id+':p'+ri+ci,1):'<b>'+E(v==null?'':v)+'</b>').join('')+'</div>').join('')+'</div>';
 return baseCard(q,inside,'ml-puzzle-card ml-puzzle-paper');
}
function word(q){
 if(!q.valid)return invalid(q);
 // Preserve existing G7 SVG/WebP loader; missing asset stays a visual fallback.
 const summary=String(q.summary||'').trim();
 const explanation=String(q.solutionPrompt||'').trim();
 const unit=String(q.unit||'').trim();
 const inside='<div class="ml-word-head"><div class="ml-svg" data-ml-svg="'+E(q.id)+'" role="img" aria-label="Hình minh họa cho bài toán"></div><p>'+E(q.prompt)+'</p></div>'+
 (summary?'<div class="ml-word-summary"><b>TÓM TẮT:</b> '+E(summary)+'</div>':'')+
 '<div class="ml-graph-paper"><h4>BÀI GIẢI</h4>'+
 '<p>'+E(explanation||'Em viết phép tính thích hợp:')+'</p>'+
 '<div class="ml-word-calc-line"><strong>Phép tính:</strong><div class="ml-word-calc">'+
 input(q,q.id+':n1',2)+input(q,q.id+':op',1)+input(q,q.id+':n2',2)+'<b>=</b>'+input(q,q.id+':sum',3)+
 (unit?' <span>('+E(unit)+')</span>':'')+'</div></div>'+
 '<div class="ml-word-result">Đáp số: '+input(q,q.id+':answer',3)+(unit?' <span>'+E(unit)+'</span>':'')+'</div></div>';
 return baseCard(q,inside,'ml-word-card ml-word-structured');
}
function invalid(q){return '<article class="ml-card ml-invalid"><small>'+E(q.label||q.id)+'</small><p>⚠ Dữ liệu câu hỏi chưa hoàn chỉnh trong Google Sheet.</p></article>';}

return Object.freeze({vertical,mental,puzzle,word,invalid});
}

/* Bộ chấm bài thuần dữ liệu, có thể tái sử dụng bởi các bài Toán khác.
   Không thao tác DOM, không ghi tiến độ. */
function danhGiaCauToan(q,read){
 if(!q||!q.valid)return false;
 const val=k=>String(read(k)||'').trim();
 if(q.type==='vertical'){
  const ans=String(q.answer).padStart(2,'0');
  const carry=(Number(q.n1)%10+Number(q.n2)%10)>=10?'1':'0';
  return val('ones')===ans[1]&&val('tens')===ans[0]&&val('carry')===carry;
 }
 if(q.type==='mental')return val('answer')!==''&&Number(val('answer'))===Number(q.answer);
 if(q.type==='missing_digit')return Array.isArray(q.puzzle)&&q.puzzle.every((row,ri)=>row.every((v,ci)=>!v||typeof v!=='object'||val('p'+ri+ci)===String(v.ans)));
 if(q.type==='word_problem'){
  const a=Number(val('n1')),b=Number(val('n2'));
  return val('n1')!==''&&val('n2')!==''&&
   ((a===Number(q.n1)&&b===Number(q.n2))||(a===Number(q.n2)&&b===Number(q.n1)))&&
   val('op')===q.op&&val('sum')!==''&&Number(val('sum'))===Number(q.answer)&&
   val('answer')!==''&&Number(val('answer'))===Number(q.answer);
 }
 return false;
}

const $=id=>document.getElementById(id);
const E=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function input(q,key,max,attr){return '<input class="ml-input" type="text" inputmode="numeric" maxlength="'+max+'" data-ml-field="'+E(key)+'" '+(attr||'')+' aria-label="'+E(key)+'">'}
function baseCard(q,inside,extra){return '<article class="ml-card '+(extra||'')+'" data-ml-q-card="'+E(q.id)+'"><small>Đặt tính rồi tính · '+E(q.n1)+' + '+E(q.n2)+'</small>'+inside+'</article>';}
const g6=taoHienThiCauToan({E,input,baseCard});let q=null;
function mount(a,b){q={id:'COL_DEMO',n1:a,n2:b,answer:String(a+b),type:'vertical',valid:true};$('cards').innerHTML=g6.vertical(q);$('result').textContent='Chưa kiểm tra';
 const inputs=[...$('cards').querySelectorAll('input')];document.body.dataset.qaInputs=String(inputs.length);
 document.body.dataset.qaFields=inputs.map(x=>x.dataset.mlField.split(':').pop()).join(',');}
$('show47').onclick=()=>mount(47,25);$('show37').onclick=()=>mount(37,18);
$('grade').onclick=()=>{const vals=Object.fromEntries([...document.querySelectorAll('[data-ml-field]')].map(x=>[x.dataset.mlField.split(':').pop(),x.value]));const pass=danhGiaCauToan(q,name=>vals[name]);$('result').textContent=pass?'Đúng!':'Chưa đúng';document.body.dataset.qaGrade=String(pass)};
mount(47,25);
if(new URLSearchParams(location.search).has('auto')){
 for(const [name,value] of [['carry','1'],['tens','7'],['ones','2']]){const el=[...document.querySelectorAll('input')].find(x=>x.dataset.mlField.endsWith(':'+name));if(el)el.value=value;}
 $('grade').click();
}
document.body.dataset.qaOverflow=String(document.documentElement.scrollWidth>document.documentElement.clientWidth+1);
</script></body></html>
